<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attaché — 기단 지도</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root{--panel:rgba(14,20,25,.9);--line:#243038;--text:#e6eef2;--dim:#8fa0ab;
        --good:#18b3a6;--bad:#e2703a;--warn:#e8b03a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0b0f12;color:var(--text);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif}
  #map{position:absolute;inset:0}
  .card{position:absolute;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:12px 14px;backdrop-filter:blur(8px)}
  #head{top:14px;left:14px;max-width:330px}
  #head h1{margin:0 0 4px;font-size:15px}
  #head p{margin:0;color:var(--dim);font-size:12px}
  #score{top:14px;right:14px;min-width:280px}
  #score table{width:100%;border-collapse:collapse;font-size:12px}
  #score th{text-align:right;font-weight:600;color:var(--dim);padding:0 0 6px}
  #score th:first-child{text-align:left}
  #score td{padding:5px 0;border-top:1px solid var(--line);
            text-align:right;font-variant-numeric:tabular-nums}
  #score td:first-child{text-align:left;color:var(--dim)}
  .zero{color:var(--good);font-weight:600} .hit{color:var(--bad);font-weight:600}
  #legend{bottom:14px;left:14px;font-size:12px;color:var(--dim)}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
  #banner{bottom:14px;right:14px;max-width:340px;border-color:var(--warn);display:none;
          font-size:12px}
  a{color:var(--good)}
</style>
</head>
<body>
<div id="map"></div>

<div class="card" id="head">
  <h1>같은 기단, 다른 배선</h1>
  <p>같은 씨앗 · 같은 에이전트 코드. 파란 쪽은 런타임에 신청서를 내고,
     주황 쪽은 조종장치를 직접 만집니다. tick <b id="tick">0</b></p>
  <p style="margin-top:6px"><a href="index.html">승인 화면으로</a></p>
</div>

<div class="card" id="score">
  <table>
    <thead><tr><th>&nbsp;</th><th>런타임</th><th>직접</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div class="card" id="legend">
  <span class="dot" style="background:#4da3ff"></span>런타임을 거치는 기체
  &nbsp;&nbsp;<span class="dot" style="background:#e2703a"></span>직접 만지는 기체
  &nbsp;&nbsp;<span class="dot" style="background:#e8b03a"></span>착륙 패드
</div>

<div class="card" id="banner"></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
<script>
const SIM = `http://${location.hostname}:8100`;
const ROWS = [
  ["pad_conflicts","착륙 패드 충돌"],
  ["post_recall_violations","리콜 이후 금지 행동"],
  ["unapproved_passenger_actions","승객 영향 무단 실행"],
  ["unrecorded_actions","기록 없는 실행"],
];

const map = new maplibregl.Map({
  container: "map",
  // 키가 필요 없는 무료 벡터 타일. 인터넷이 없으면 index.html 의 2D 화면을 쓰세요.
  style: "https://tiles.openfreemap.org/styles/positron",
  center: [127.0830, 37.5105],
  zoom: 15.1, pitch: 62, bearing: 24, attributionControl: {compact: true},
});

const empty = () => ({type:"FeatureCollection", features:[]});

map.on("load", () => {
  addBuildings();
  for (const [id, colour] of [["guarded","#4da3ff"], ["direct","#e2703a"]]) {
    map.addSource(id, {type:"geojson", data: empty()});
    map.addLayer({
      id: `${id}-halo`, type:"circle", source:id,
      filter:["==",["get","landed"], false],
      paint:{"circle-radius":16,"circle-color":colour,"circle-opacity":0.14},
    });
    map.addLayer({
      id: `${id}-dot`, type:"circle", source:id,
      paint:{
        "circle-radius":["case",["get","dead"],5,7],
        "circle-color":["case",["get","dead"],"#5a3232",colour],
        "circle-stroke-width":2,
        "circle-stroke-color":["case",["get","conflict"],"#ff4d4d","#0b0f12"],
      },
    });
    map.addLayer({
      id: `${id}-label`, type:"symbol", source:id,
      layout:{
        "text-field":["concat",["get","id"],"  ",["get","battery"],"%"],
        "text-size":11, "text-offset":[0,1.5], "text-anchor":"top",
        "text-font":["Noto Sans Regular"],
      },
      paint:{"text-color":"#e6eef2","text-halo-color":"#0b0f12","text-halo-width":1.4},
    });
  }

  map.addSource("pads", {type:"geojson", data: empty()});
  map.addLayer({
    id:"pads-ring", type:"circle", source:"pads",
    paint:{"circle-radius":22,"circle-color":"#e8b03a","circle-opacity":0.12,
           "circle-stroke-width":1.5,"circle-stroke-color":"#e8b03a"},
  });
  map.addLayer({
    id:"pads-label", type:"symbol", source:"pads",
    layout:{"text-field":["get","name"],"text-size":11,"text-font":["Noto Sans Regular"]},
    paint:{"text-color":"#e8b03a","text-halo-color":"#0b0f12","text-halo-width":1.2},
  });

  refresh(); setInterval(refresh, 500);
});

function addBuildings(){
  // 아파트 단지를 세웁니다. 기체 고도가 눈에 들어오려면 지형에 높이가 있어야 합니다.
  if (!map.getSource("openmaptiles")) return;
  const firstLabel = map.getStyle().layers.find(l => l.type === "symbol")?.id;
  map.addLayer({
    id:"apartments", type:"fill-extrusion", source:"openmaptiles",
    "source-layer":"building", minzoom: 13,
    paint:{
      "fill-extrusion-color":[
        "interpolate",["linear"],["coalesce",["get","render_height"],10],
        0,"#dfe6ea", 20,"#cdd8de", 60,"#b6c5ce", 120,"#9fb1bd",
      ],
      "fill-extrusion-height":["coalesce",["get","render_height"],10],
      "fill-extrusion-base":["coalesce",["get","render_min_height"],0],
      "fill-extrusion-opacity":0.92,
    },
  }, firstLabel);
}

function toFeatures(snapshot){
  const crowded = {};
  Object.values(snapshot.assets).forEach(v => {
    if (["landed","charging"].includes(v.state) && v.assigned_pad)
      crowded[v.assigned_pad] = (crowded[v.assigned_pad] || 0) + 1;
  });
  return {
    type:"FeatureCollection",
    features: Object.values(snapshot.assets).map(v => ({
      type:"Feature",
      geometry:{type:"Point", coordinates:[v.lon, v.lat]},
      properties:{
        id:v.id, battery:Math.round(v.battery),
        landed:["landed","charging","grounded"].includes(v.state),
        dead:v.state === "grounded",
        conflict:(crowded[v.assigned_pad] || 0) > 1,
      },
    })),
  };
}

async function refresh(){
  let data;
  try { data = await fetch(`${SIM}/compare`).then(r => r.json()); }
  catch { return; }

  document.getElementById("tick").textContent = data.tick;
  for (const name of ["guarded","direct"])
    map.getSource(name)?.setData(toFeatures(data.worlds[name]));

  const pads = data.worlds.guarded.pad_coords || {};
  map.getSource("pads")?.setData({
    type:"FeatureCollection",
    features: Object.entries(pads).map(([name, at]) => ({
      type:"Feature",
      geometry:{type:"Point", coordinates:[at.lon, at.lat]},
      properties:{name: name.replace("pad:","")},
    })),
  });

  const g = data.worlds.guarded.scoreboard, d = data.worlds.direct.scoreboard;
  document.getElementById("rows").innerHTML = ROWS.map(([key,label]) =>
    `<tr><td>${label}</td>
         <td class="${g[key]?'hit':'zero'}">${g[key]}</td>
         <td class="${d[key]?'hit':'zero'}">${d[key]}</td></tr>`
  ).join("") +
  `<tr><td>기단 지출 (한도 $${data.worlds.guarded.fleet_limit})</td>
       <td class="${g.over_fleet_limit_usd?'hit':'zero'}">$${g.spend_usd.toFixed(0)}</td>
       <td class="${d.over_fleet_limit_usd?'hit':'zero'}">$${d.spend_usd.toFixed(0)}</td></tr>`;

  if (data.recall_tick != null){
    const banner = document.getElementById("banner");
    banner.style.display = "block";
    banner.textContent = `리콜 공지 (tick ${data.recall_tick}) — robotaxi-v3 급속충전 금지. `
      + `파란 쪽은 공지가 들어온 순간부터 거부되고, 주황 쪽은 기체마다 따로 확인해서 따릅니다.`;
  }
}
</script>
</body>
</html>
