<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Attaché — 기단 지도</title>
<link rel="icon" href="data:,">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root{--panel:rgba(12,17,21,.92);--line:#2a3740;--text:#e9f0f4;--dim:#93a4af;
        --guard:#3d8bff;--direct:#ff7a3d;--zone:#ff3b30;--warn:#e8b03a;--ok:#18b3a6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0a0e11;color:var(--text);
       font:13px/1.55 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Segoe UI",sans-serif}
  #map{position:absolute;inset:0}
  .card{position:absolute;background:var(--panel);border:1px solid var(--line);
        border-radius:10px;padding:11px 13px;backdrop-filter:blur(10px);
        box-shadow:0 8px 28px rgba(0,0,0,.35)}
  /* 상단 카드. 안의 것은 전부 카드 안에 있어야 합니다 — 버튼 하나가 선 밖으로 튀어나가 있었습니다. */
  #head{top:12px;left:12px;width:324px;overflow:hidden}
  #head h1{margin:0 0 3px;font-size:14px;letter-spacing:.2px}
  #head p{margin:0;color:var(--dim);font-size:11.5px}
  #head .row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
  #score{top:12px;right:12px;width:290px}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{text-align:right;color:var(--dim);font-weight:600;padding:0 0 5px;font-size:10.5px}
  th:first-child{text-align:left}
  td{padding:4px 0;border-top:1px solid var(--line);text-align:right;
     font-variant-numeric:tabular-nums;font-weight:600}
  td:first-child{text-align:left;color:var(--dim);font-weight:400}
  .g{color:var(--guard)} .d{color:var(--direct)}
  .zero{color:var(--ok)} .hit{color:var(--zone)}
  #acts{right:12px;top:250px;width:290px;max-height:38vh;overflow:auto}
  #acts h2,#head h2{margin:0 0 7px;font-size:10.5px;color:var(--dim);letter-spacing:.7px}
  .ev{padding:5px 0;border-top:1px solid var(--line);font-size:11.5px;line-height:1.45}
  .ev:first-child{border-top:0}
  .ev b{font-weight:600}
  .tag{display:inline-block;padding:0 5px;border-radius:4px;font-size:10px;
       margin-right:5px;font-weight:600}
  .t-auto{background:rgba(24,179,166,.18);color:var(--ok)}
  .t-deny{background:rgba(255,59,48,.18);color:var(--zone)}
  .t-human{background:rgba(232,176,58,.18);color:var(--warn)}
  .tier{display:inline-block;padding:0 4px;border-radius:3px;font-size:9.5px;font-weight:700;
        letter-spacing:.4px;background:rgba(118,185,0,.18);color:#a6e05a;vertical-align:1px}
  #legend{bottom:12px;left:12px;font-size:11.5px;color:var(--dim);line-height:1.9}
  /* 키 안내. 버튼이 아니라 어떤 키를 같이 누르면 되는지를 적어 둔 판. 왼쪽 세로 중앙. */
  #keys{top:50%;left:12px;transform:translateY(-50%);width:auto;padding:8px 11px;
        font-size:11px;color:var(--dim)}
  #keys h2{margin:0 0 5px;font-size:10.5px;color:var(--dim);letter-spacing:.7px}
  #keys .key{display:flex;align-items:center;gap:8px;padding:2px 0;white-space:nowrap}
  #keys .combo{display:inline-flex;align-items:center;gap:2px;min-width:104px;color:var(--text)}
  #keys kbd{font:600 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text);
        border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:1px 5px;
        background:rgba(255,255,255,.04)}
  .k{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;
     vertical-align:-1px}
  /* 공지 배너. 지도의 확대 버튼(오른쪽 아래 세로줄)과 출처 표기(맨 아랫줄) 위에 놓습니다 —
     구석에 붙이면 둘이 배너의 마지막 줄을 가렸습니다. */
  #banner{bottom:40px;right:56px;width:330px;border-color:var(--zone);display:none;
          font-size:11.5px}
  a{color:var(--ok);text-decoration:none}
  .route-key{display:inline-block;width:22px;border-top:3px solid #29c76f;
             margin-right:6px;vertical-align:3px}
  .route-key.denied{border-color:var(--zone);border-top-style:dashed}
  .route-key.pending{border-color:#ffd23f;border-top-width:2px;border-top-style:dotted}
  #denial{top:12px;left:50%;transform:translateX(-50%);width:min(420px,calc(100% - 650px));
          border-color:var(--zone);border-left-width:4px;overflow-wrap:anywhere}
  #denial[hidden]{display:none}
  #denial,.ev[data-asset]{cursor:pointer}
  .ev[data-asset]:hover{background:rgba(255,255,255,.03)}
  #denial .line1{display:flex;align-items:center;gap:6px;font-size:12.5px}
  #denial .line1 b{color:#ff9d95;font-weight:600}
  #denial-what{color:var(--dim)}
  #denial-why{margin-top:5px;font-size:12.5px;line-height:1.5}
  .note{margin-top:4px;font-size:10.5px;color:var(--dim);line-height:1.5}
  #head .topline{display:flex;align-items:center;justify-content:space-between;gap:8px}
  #lang{display:flex;gap:3px}
  #lang button{background:transparent;border:1px solid var(--line);color:var(--dim);
    border-radius:6px;padding:2px 7px;font:600 10.5px inherit;cursor:pointer;letter-spacing:.4px}
  #lang button.on{background:rgba(61,139,255,.18);border-color:var(--guard);color:#bcd8ff}
  /* 보기 전환은 한 덩어리 분할 버튼. 따로따로 놓으면 카드 폭을 넘칩니다. */
  #show{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:0 0 auto}
  #show button{background:transparent;border:0;color:var(--dim);padding:3px 9px;
    font:600 10.5px inherit;cursor:pointer;letter-spacing:.4px}
  #show button+button{border-left:1px solid var(--line)}
  #show button.on{background:rgba(61,139,255,.18);color:#bcd8ff}
  #restart{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:6px;
    padding:2px 8px;font:600 10.5px inherit;cursor:pointer;letter-spacing:.4px;white-space:nowrap}
  #restart::before{content:"↻ ";font-weight:400}
  #restart:hover{border-color:var(--warn);color:#ffd98a}
  #legend div{white-space:nowrap}
  #legend .note{white-space:normal;max-width:330px}
  .maplibregl-popup-content{background:var(--panel);color:var(--text);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;font:12px/1.6 inherit;min-width:190px}
  .maplibregl-popup-tip{border-top-color:var(--panel)!important;
    border-bottom-color:var(--panel)!important}
  .maplibregl-popup-close-button{color:var(--dim);font-size:16px;padding:2px 6px}
  .pop h3{margin:0 0 6px;font-size:12.5px;display:flex;align-items:center;gap:6px}
  .pop dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px}
  .pop dt{color:var(--dim);font-size:11px}
  .pop dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
  /* 관제 권고. 화면 아래 가운데 — 범례(왼쪽)와 공지 배너(오른쪽) 사이. 정보 카드라 노란 테두리. */
  #advisory{bottom:12px;left:50%;transform:translateX(-50%);width:min(470px,calc(100% - 740px));
            border-color:var(--warn);border-left-width:4px;overflow-wrap:anywhere;cursor:pointer}
  #advisory[hidden]{display:none}
  #advisory .line1{display:flex;align-items:center;gap:6px;font-size:12.5px}
  #advisory .line1 b{color:#ffd98a;font-weight:600}
  #advisory-source{color:var(--dim);margin-left:auto;font-size:10.5px;letter-spacing:.4px}
  #advisory-summary{margin-top:5px;font-size:12.5px;line-height:1.5}
  #advisory-options{list-style:none;margin:6px 0 0;padding:0;font-size:11.5px;line-height:1.5}
  #advisory-options li{padding:2px 0 2px 16px;position:relative;color:var(--dim)}
  #advisory-options li::before{content:"○";position:absolute;left:0;color:var(--dim)}
  #advisory-options li.ok{color:var(--text)}
  #advisory-options li.no{text-decoration:line-through;opacity:.7}
  #advisory-options li.chosen{color:#ffd98a}
  #advisory-options li.chosen::before{content:"●";color:var(--warn)}
  @media(max-width:1050px){
    #denial{top:155px;left:12px;transform:none;width:300px}
    #advisory{left:12px;transform:none;width:330px;bottom:150px}
  }
  @media(max-width:640px){
    #head{width:calc(100% - 24px)}
    #score{top:155px;width:205px}
    #acts{top:390px;width:205px;max-height:22vh}
    #denial{top:auto;bottom:175px;width:calc(100% - 24px);z-index:2}
    #legend{font-size:10px;max-width:calc(100% - 24px)}
    #banner{bottom:175px;width:calc(100% - 24px)}
  }
</style>
</head>
<body>
<div id="map"></div>

<div class="card" id="head">
  <div class="topline">
    <h1 data-t="title"></h1>
    <div id="lang"><button data-lang="en">EN</button><button data-lang="ko">KR</button></div>
  </div>
  <div class="row" style="margin-top:7px">
    <span class="note" style="margin:0" data-t="show"></span>
    <div id="show"><button data-show="guarded">RUNTIME</button><button data-show="direct">DIRECT</button><button data-show="both">BOTH</button></div>
  </div>
  <p style="margin-top:7px" data-t="lede"></p>
  <div class="row" style="margin-top:7px">
    <span>tick <b id="tick">0</b> · <a href="index.html" data-t="approvals"></a></span>
    <button id="restart" data-t="restart"></button>
  </div>
  <p class="note" id="llm-line" style="margin-top:6px"></p>
</div>



<div class="card" id="score">
  <table>
    <thead><tr><th>&nbsp;</th><th class="g" data-t="guarded"></th>
      <th class="d" data-t="direct"></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<div class="card" id="acts">
  <h2 data-t="ledger"></h2>
  <div id="feed"></div>
</div>

<div class="card" id="legend">
  <div><span class="route-key pending"></span><span data-t="lg_pending"></span>
       <span class="route-key" style="margin-left:10px"></span><span data-t="lg_ok"></span>
       <span class="route-key denied" style="margin-left:10px"></span><span data-t="lg_no"></span></div>
  <div><span class="k" style="background:var(--zone)"></span><span data-t="lg_block"></span>
       <span class="k" style="background:#18b3a6;margin-left:10px"></span><span data-t="lg_landing"></span></div>
  <div><span class="k" style="background:#eee7ce"></span><span data-t="lg_depot"></span></div>
  <div><span class="k" style="background:#c1121f"></span><span data-t="lg_nofly"></span>
       <span data-t="lg_ceil" style="margin-left:10px"></span>
       <span class="k" style="background:#ffb020;margin-left:6px"></span>30
       <span class="k" style="background:#d8d92c"></span>61
       <span class="k" style="background:#48c06a"></span>91
       <span class="k" style="background:#2b8fe0"></span>122&nbsp;m</div>
  <div class="note" data-t="lg_source"></div>
</div>

<div class="card" id="keys" aria-label="keyboard">
  <h2 data-t="keys_title"></h2>
  <div class="key"><span class="combo"><kbd>Shift</kbd>+<kbd>←</kbd><kbd>→</kbd></span><span data-t="keys_rotate"></span></div>
  <div class="key"><span class="combo"><kbd>Shift</kbd>+<kbd>↑</kbd><kbd>↓</kbd></span><span data-t="keys_tilt"></span></div>
  <div class="key"><span class="combo"><kbd>+</kbd><kbd>−</kbd></span><span data-t="keys_zoom"></span></div>
  <div class="key"><span class="combo"><kbd>N</kbd></span><span data-t="keys_north"></span></div>
  <div class="key"><span class="combo"><kbd>H</kbd></span><span data-t="keys_home"></span></div>
  <div class="key"><span class="combo"><kbd>1</kbd>–<kbd>4</kbd></span><span data-t="keys_focus"></span></div>
  <div class="key"><span class="combo"><kbd data-t="keys_drag"></kbd></span><span data-t="keys_orbit"></span></div>
</div>

<div class="card" id="banner"></div>
<div class="card" id="denial" role="alert" aria-atomic="true" hidden>
  <div class="line1"><span class="tag t-deny">거절</span><b id="denial-who"></b>
    <span id="denial-what"></span></div>
  <div id="denial-why"></div>
  <div id="denial-more" class="note"></div>
</div>
<!-- 관제 권고. 연속 거절 뒤 런타임이 원장에 남긴 정보입니다. 아무것도 바꾸지 않습니다 — 결정은 운영사가. -->
<div class="card" id="advisory" role="status" aria-atomic="true" hidden>
  <div class="line1"><span class="tag t-human" id="advisory-tag"></span><b id="advisory-who"></b>
    <span id="advisory-source"></span></div>
  <div id="advisory-summary"></div>
  <ul id="advisory-options"></ul>
  <div id="advisory-note" class="note"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.9.0/dist/maplibre-gl.js"></script>
<script type="module">

// 두 번째 스택을 같은 화면으로 보려고 ?rt=8010&sim=8110 처럼 포트를 바꿀 수 있습니다. 기본은 8000/8100.
const query = typeof URLSearchParams === "function" ? new URLSearchParams(location.search || "") : new Map();
const SIM = `http://${location.hostname}:${query.get("sim") || 8100}`;
const RT  = `http://${location.hostname}:${query.get("rt") || 8000}`;
const POLL_MS = 500;
const DENIAL_MS = 8000;
// 관제 권고 카드. 거절 카드보다 조금 길게 — 선택지 목록을 읽을 시간입니다.
const ADVISORY_MS = 12000;

// 화면 말. 원장에는 기계 이름이 남고 사람에게는 사람 말이 보입니다.
// 한 화면에 두 언어를 섞으면 아무도 못 읽어서, 통째로 갈아끼웁니다.
const TEXT = {

    ledger:"What the runtime did", empty:"Nothing yet",

    d_withdraw:"WITHDRAWN",

    b_notam_held:"<b>NOTAM</b> · %s — read by %s, waiting for a person before it applies.",
    b_notam_confirmed:"<b>NOTAM</b> (tick %s–%s) · %s — confirmed by %s; applies when the window opens.",

    t_auto:"RUN", t_denied:"DENY", t_human:"HUMAN", t_queued:"QUEUE",

    d_more:"%s more",

    p_form:"Last form by", p_drafter:"Route by", p_judged:"Judged", by_rules:"rules",
    rule_source:"rule %s",
    fly_route:"delivery route", reserve_pad:"bay reservation", charge:"charge",

    diverted:"route pulled",
    // 관제 권고. 런타임은 선택지 id 와 값만 주고 문구는 여기서 만듭니다.

    adv_src_rules:"rules", adv_src_super:"super",

    adv_legal:"legal", adv_illegal:"not legal", r_advisory:"advisory · %s",

    opt_decline:"decline the order", opt_escalate:"escalate to a person",
    // 공지 원장 줄. 문장은 코드에서, 이유(why)는 런타임 값 그대로.
    publish_notice:"airspace notice", r_notice_unreadable:"not read by the runtime (%s)",
    r_notice_published:"confirmed by a person — now enforced", r_notice_refused:"refused by a person — not enforced",

  ko: {
    title:"같은 기단, 다른 배선",
    lede:'같은 씨앗 · 같은 감지 코드 · 같은 신청서 작성기. <span class="g">파랑</span>은 '

    approvals:"승인 화면 →", show:"표시", restart:"처음부터",

let lang = "en";
// 두 세계는 같은 씨앗·같은 주문이라 겹쳐 보입니다. 지도는 런타임 쪽만 그리고,
// 대조는 점수판이 합니다 — 비교가 필요하면 BOTH 로 켭니다.
let showing = "guarded";
try {
  lang = localStorage.getItem("attache-lang") || "en";
  showing = localStorage.getItem("attache-show") || "guarded";
} catch (error) { void error; }
const visible = world => showing === "both" || showing === world;
const t = (key, ...args) => {
  const raw = TEXT[lang]?.[key] ?? TEXT.en[key] ?? key;
  return args.reduce((text, value) => text.replace("%s", value), raw);
};

// 착륙대 충돌 행은 뺐습니다. 충전대 순환이 없어져 두 세계 다 0이 되는 행은 뜻이 없습니다.
const ROWS = ["separation_losses", "site_conflicts", "zone_incursions", "zone_dwell_ticks",
              "post_recall_violations", "unapproved_passenger_actions",
              "unrecorded_actions"];

const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/positron",
  // 지면 경로 없이도 공중 회랑이 읽히도록 가까이서 시작합니다.
  center: [-73.973, 40.718], zoom: 14.5, pitch: 45, bearing: -28,   // HOME_VIEW 와 같은 값
  attributionControl: {compact: true},
});

// 나침반을 끌면 회전·기울이기가 됩니다. 키보드는 MapLibre 기본값 그대로:
// Shift+←/→ 회전, Shift+↑/↓ 기울이기, +/- 확대. 지도를 한 번 눌러 초점을 줘야 먹습니다.
map.addControl(new maplibregl.NavigationControl({visualizePitch:true}), "bottom-right");

const empty = () => ({type:"FeatureCollection", features:[]});
// 폴링은 0.5초인데 화면은 60fps 입니다. 그 사이를 채워야 안 끊겨 보입니다.
const motion = new Map();
const flights = new Map();
// 원장에 닫힌 결정 하나 = 되짚어 그릴 구간 하나. 신청한 경로를 그대로 씁니다.
let stages = [];
const queued = new Map();       // 기체별로 다음 구간이 시작할 수 있는 시각
let seenDenials = new Set(), denialUntil = 0, roundStartedAt = 0;
let seenAdvisories = new Set(), advisoryUntil = 0;

// 공역은 [위도, 경도] 로 옵니다. GeoJSON 은 [경도, 위도] 이고 고리를 닫아야 합니다.
function closedRing(points){
  return [...points.map(p => [p[1], p[0]]), [points[0][1], points[0][0]]];
}

map.on("load", () => {
  // 구역 색은 땅에 칠합니다 — 건물보다 먼저 그려야 합니다. 건물 뒤에 그리면 건물 옆면까지
  // 물들고, 그 위를 지나는 기체와 회랑이 색을 밀어내는 것처럼 보입니다.
  const firstLabel = map.getStyle().layers.find(l => l.type === "symbol")?.id;
  addAirspaceLayers(firstLabel);
  if (map.getSource("openmaptiles")){
    map.addLayer({
      id:"apartments", type:"fill-extrusion", source:"openmaptiles",
      "source-layer":"building", minzoom:13,
      paint:{
        "fill-extrusion-color":["interpolate",["linear"],
          ["coalesce",["get","render_height"],10],
          0,"#e3eaee", 20,"#cfdae1", 60,"#b4c4ce", 120,"#9aadba"],
        "fill-extrusion-height":["coalesce",["get","render_height"],10],
        "fill-extrusion-base":["coalesce",["get","render_min_height"],0],
        "fill-extrusion-opacity":.92,
      },
    }, firstLabel);
    // 보이지 않는 바닥면. 기울인 지도에서 3D 건물을 점으로 물으면 옆면·지붕이 잡혀 자리와 다른 동이
    // 나옵니다. 바닥면은 좌표 그대로라 그 점이 실제로 올라선 동만 답합니다.
    map.addLayer({id:"footprints", type:"fill", source:"openmaptiles",
      "source-layer":"building", minzoom:13, paint:{"fill-opacity":0}}, firstLabel);
  }
  // 창고는 점이 아니라 건물입니다. 창고 좌표 밑에 있는 타일 건물을 그대로 창고색으로 칠합니다.
  // 건물 도형은 타일이 그려진 뒤에야 물을 수 있어서(idle), 그때 한 번 찾아 붙입니다.
  map.addSource("depot-building", {type:"geojson", data:empty()});
  map.addLayer({id:"depot-building", type:"fill-extrusion", source:"depot-building",
    paint:{"fill-extrusion-color":"#eee7ce", "fill-extrusion-opacity":.98,
      "fill-extrusion-height":["get","height"], "fill-extrusion-base":["get","base"]}}, firstLabel);


  // 경로 데이터는 공중 회랑 한 벌뿐입니다. 기체별 레이어는 독립적으로 깜빡이기 위함입니다.
  map.addSource("flightpath", {type:"geojson", data:empty()});

  // 무엇이 막았는지. 건물은 실제 높이로 붉게 세우고(선이 그 안으로 들어가는 게 보여야 하므로),
  // 구역·격자는 바닥에만 붉게 칠합니다 — 900m 격자를 벽으로 세우면 거절된 회랑까지 덮습니다.
  map.addSource("blocker", {type:"geojson", data:empty()});
  map.addLayer({id:"blocker-ground", type:"fill", source:"blocker",
    filter:["==",["get","height"],0],
    paint:{"fill-color":"#ff3b30", "fill-opacity":.35}});
  map.addLayer({id:"blocker", type:"fill-extrusion", source:"blocker",
    filter:[">",["get","height"],0],
    paint:{"fill-extrusion-color":"#ff3b30", "fill-extrusion-base":0,
      "fill-extrusion-height":["get","height"], "fill-extrusion-opacity":.5}});
  // 어디서 걸렸는지. 신청한 선 위의 그 점입니다.
  map.addSource("breach", {type:"geojson", data:empty()});
  map.addLayer({id:"breach-dot", type:"circle", source:"breach",
    paint:{"circle-radius":7, "circle-color":"#ff3b30", "circle-opacity":.95,
      "circle-stroke-width":2, "circle-stroke-color":"#ffe9e7"}});
  map.addLayer({id:"breach-label", type:"symbol", source:"breach",
    layout:{"text-field":["get","label"], "text-size":12, "text-offset":[0,-1.5],
      "text-font":["Noto Sans Regular"], "text-allow-overlap":true},
    paint:{"text-color":"#ffc9c4", "text-halo-color":"#1a0806", "text-halo-width":2.2}});

  // 지금 무슨 단계인지 선 끝에 씁니다. 화면만 보고도 신청·거절·승인이 읽혀야 합니다.
  map.addSource("stage-label", {type:"geojson", data:empty()});
  map.addLayer({id:"stage-label", type:"symbol", source:"stage-label",
    layout:{"text-field":["get","label"], "text-size":12.5, "text-offset":[0,-1.3],
      "text-font":["Noto Sans Regular"], "text-allow-overlap":true},
    paint:{"text-color":["case",
        ["==",["get","kind"],"approved"],"#7ff0ae",
        ["==",["get","kind"],"pending"],"#ffd98a", "#ffc9c4"],
      "text-halo-color":"#0a0e11", "text-halo-width":2.2}});

  map.addSource("depot", {type:"geojson", data:empty()});
  map.addLayer({id:"depot-marker", type:"circle", source:"depot",
    paint:{"circle-radius":8,"circle-color":"#eee7ce",
      "circle-stroke-color":"#18232b","circle-stroke-width":3}});
  map.addLayer({id:"depot-label", type:"symbol", source:"depot",
    layout:{"text-field":"Delivery Warehouse", "text-size":13,
      "text-font":["Noto Sans Regular"],"text-offset":[0,-2],
      "text-allow-overlap":true},
    paint:{"text-color":"#fff4d5","text-halo-color":"#18232b","text-halo-width":2}});

  // 지정 착륙장. 배달은 여기로만 갑니다. 땅에 붙은 표지라 경로·기체 아래에 있습니다.
  // 원은 땅에 붙은 다각형(반지름 30m)입니다. 화면을 향한 동그라미는 기울여도 안 눕습니다.
  map.addSource("landing", {type:"geojson", data: empty()});
  map.addSource("landing-disc", {type:"geojson", data: empty()});
  map.addLayer({id:"landing-fill", type:"fill", source:"landing-disc",
    paint:{"fill-color":"#18b3a6","fill-opacity":.22}}, firstLabel);
  map.addLayer({id:"landing-ring", type:"line", source:"landing-disc",
    paint:{"line-color":"#18b3a6","line-width":1.6,"line-opacity":.9}}, firstLabel);
  map.addLayer({id:"landing-label", type:"symbol", source:"landing",
    layout:{"text-field":["concat",["get","name"],"\n",["get","tag"]],
            "text-size":["interpolate",["linear"],["zoom"],12,9,16,12],
            "text-font":["Noto Sans Regular"],"text-offset":[0,1.4],"text-anchor":"top",
            "text-line-height":1.2},
    paint:{"text-color":"#18b3a6","text-halo-color":"#0a0e11","text-halo-width":1.3}});

  // 창고 옥상 위 기체 자리 넷. 착륙·하역·적재는 늘 여기서 합니다 — 안 그리면 창고 근처 아무 데나
  // 앉았다 뜨는 것처럼 보였습니다. 옥상 높이에 얇은 판으로 올립니다.
  map.addSource("seats", {type:"geojson", data: empty()});
  map.addLayer({id:"seat-plate", type:"fill-extrusion", source:"seats",
    paint:{"fill-extrusion-color":"#fff4d5", "fill-extrusion-opacity":.75,
      "fill-extrusion-base":["get","base"], "fill-extrusion-height":["get","height"]}}, firstLabel);
  map.addLayer({id:"seat-label", type:"symbol", source:"seats",
    layout:{"text-field":["get","name"], "text-size":10.5, "text-font":["Noto Sans Regular"],
            "text-offset":[0,1.1], "text-anchor":"top", "text-allow-overlap":true},
    paint:{"text-color":"#fff4d5","text-halo-color":"#18232b","text-halo-width":1.6}});

  // 기체는 고도에 뜬 덩어리로 그립니다. MapLibre 는 심볼을 못 띄우므로 아이콘으로는
  // 지면에 붙어 다니는 것처럼 보입니다. 지면에는 이름표만 남습니다.
  map.addSource("craft", {type:"geojson", data:empty()});
  map.addLayer({id:"craft-body", type:"fill-extrusion", source:"craft",
    paint:{"fill-extrusion-color":["case",["==",["get","world"],"direct"],
        "#ff7a3d","#3d8bff"],
      "fill-extrusion-base":["get","base"], "fill-extrusion-height":["get","height"],
      "fill-extrusion-opacity":.95}});
  map.addSource("cargo", {type:"geojson", data:empty()});
  map.addLayer({id:"cargo-box", type:"fill-extrusion", source:"cargo",
    paint:{"fill-extrusion-color":"#c9a26a",
      "fill-extrusion-base":["get","base"], "fill-extrusion-height":["get","height"],
      "fill-extrusion-opacity":.9}});

  for (const [id, colour] of [["guarded","#3d8bff"], ["direct","#ff7a3d"]]){
    map.addSource(id, {type:"geojson", data: empty()});
    map.addLayer({id:`${id}-icon`, type:"symbol", source:id,
      layout:{
              // 이름 · 상태(상태마다 색) 그리고 아랫줄에 갈 고도. 멈춰 있으면 왜 멈춰 있는지가
              // 여기서 읽혀야 합니다 — 싣는 중 3/6, 내리는 중 2, 승인 대기, 충전 45%.
              "text-field":["format",
                ["get","id"], {},
                ["case",["==",["get","work"],""],"",
                        ["concat","  ·  ",["upcase",["get","work"]]]], {"text-color":["get","tone"]},
                ["case",["==",["get","altitude"],""],"",
                        ["concat","\n",["get","altitude"]]], {"text-color":"#c8d4de","font-scale":.9}],

              "text-size":["interpolate",["linear"],["zoom"],12,9.5,17,13,19,16],

  // 기체를 누르면 그 기체가 지금 무엇을 하고 있는지. 화면의 숫자는 기단 합계라
  // 한 대가 왜 저러고 있는지는 여기서만 보입니다.

/** 공역을 땅에 칠합니다. 건물·기체·회랑보다 아래 — 지도 바닥의 한 겹입니다. */
function addAirspaceLayers(before){
  // 진짜 FAA 격자. 블록마다 천장이 다릅니다.
  // 구역은 바닥에 색만 칠합니다. 천장 높이대로 입체를 세웠더니(0~200m 반투명 벽) 55m 회랑과
  // 기체가 그 속에 파묻혔고, 반투명이 여러 겹 겹치며 깨져 보였습니다. 등급은 색으로 읽히고,
  // 높이 숫자는 범례와 거절 사유에 있습니다. 경로와 기체 위에는 아무것도 서지 않습니다.
  map.addSource("cells", {type:"geojson", data: empty()});
  map.addLayer({id:"cells-fill", type:"fill", source:"cells",
    paint:{"fill-color":["case",
        ["==",["get","rule"],"forbidden"], "#c1121f",
        ["interpolate",["linear"],["coalesce",["get","ceiling"],122],
          15,"#f08c3c", 30,"#f0b73c", 61,"#c9d14a", 91,"#7fc27a", 122,"#4aa3d1"]],
      "fill-opacity":["case",["==",["get","rule"],"forbidden"],.30,.14]}}, before);
  map.addLayer({id:"cells-line", type:"line", source:"cells",
    paint:{"line-color":["case",["==",["get","rule"],"forbidden"],"#c1121f","#7d8f9a"],
           "line-width":["case",["==",["get","rule"],"forbidden"],1.4,.5],
           "line-opacity":.6}}, before);

  // 중간에 새로 닫히는 구역 — 런타임이 무엇을 강제하는지 눈에 보여야 합니다
  map.addSource("zone", {type:"geojson", data: empty()});
  map.addLayer({id:"zone-fill", type:"fill", source:"zone",
    paint:{"fill-color":"#ff3b30","fill-opacity":.16}}, before);
  map.addLayer({id:"zone-line", type:"line", source:"zone",
    paint:{"line-color":"#ff3b30","line-width":2,"line-dasharray":[3,2]}}, before);
}

    [t("p_state"), t(v.state)],

    [t("p_alt"), `${Math.round(v.alt_m ?? 0)} m`],

    [t("p_route"), guarded ? `${(v.route || []).length}` : t("p_none")],
    [t("p_done"), `${v.delivered ?? 0}`],
  ];
  if (guarded){
    const last = (lastRuntime?.ledger || []).find(e => e.proposal?.asset_id === v.id && e.outcome !== "pending");
    if (last){

      `<dt>${safe(key)}</dt><dd>${safe(value)}</dd>`).join("")}</dl></div>`;
}

function camera(what){
  if (what === "left") map.easeTo({bearing:map.getBearing() - 30, duration:400});
  else if (what === "right") map.easeTo({bearing:map.getBearing() + 30, duration:400});
  else if (what === "up") map.easeTo({pitch:Math.min(85, map.getPitch() + 15), duration:400});
  else if (what === "down") map.easeTo({pitch:Math.max(0, map.getPitch() - 15), duration:400});
  else if (what === "north") map.easeTo({bearing:0, duration:500});
  else if (what === "home") map.flyTo({...HOME_VIEW, duration:900});
}
document.addEventListener?.("keydown", event => {
  if (event.metaKey || event.ctrlKey || event.altKey) return;
  const tag = event.target?.tagName;
  if (tag === "INPUT" || tag === "TEXTAREA") return;
  const key = event.key.toLowerCase();
  if (key === "n") camera("north");
  else if (key === "h") camera("home");
  else if (/^[1-4]$/.test(key)) focusAsset(`drone-0${key}`);
  else if (event.shiftKey && key === "arrowleft") camera("left");
  else if (event.shiftKey && key === "arrowright") camera("right");
  else if (event.shiftKey && key === "arrowup") camera("up");
  else if (event.shiftKey && key === "arrowdown") camera("down");
  else if (key === "+" || key === "=") map.zoomIn({duration:300});
  else if (key === "-" || key === "_") map.zoomOut({duration:300});
  else return;
  event.preventDefault();
});

function draw(){
  requestAnimationFrame(draw);
  const now = performance.now();
  expireDenials(now);
  const ribbons0 = [];
  const staged = drawStages(now, ribbons0);
  if (!latest){
    map.getSource("flightpath")?.setData({type:"FeatureCollection", features:ribbons0});
    return;
  }
  const ribbons = ribbons0, craft = [], cargo = [];
  for (const world of ["guarded","direct"]){
    const features = [];
    for (const v of Object.values(latest.worlds[world].assets)){
      const key = `${world}:${v.id}`;
      const m = motion.get(key);
      if (!m) continue;
      const point = motionPoint(m, now, POLL_MS);
      const ahead = motionPoint(m, now + 16, POLL_MS);
      const heading = point[0] === ahead[0] && point[1] === ahead[1] ? v.heading ?? 0 :
        Math.atan2((ahead[0] - point[0]) * Math.cos(point[1] * Math.PI / 180),
          ahead[1] - point[1]) * 180 / Math.PI;
      if (world === "guarded" && !staged.growing.has(v.id) &&
          m.curve?.coordinates.length > 1 &&
          (v.route?.length || now < m.at + POLL_MS)){
        // 지나온 구간은 지웁니다. 남은 경로만 승인된 것이고, 다 그려두면 기체가
        // 어디까지 왔는지가 선에서 안 읽힙니다.
        const span = Math.max(0, Math.min(1, (now - m.at) / POLL_MS));
        const flown = m.from + (m.to - m.from) * span;
        const total = m.curve.progress.at(-1);
        if (total - flown > 1e-9 && visible(world)){
          corridorAlpha(v.id, 1);
          for (const piece of [...curveColumns(m.curve, flown, total), ...curveRibbon(m.curve, flown, total)])
            ribbons.push(extrusion(piece, {asset:v.id, phase:"approved"}));
        }
      }
      // 몇 미터로 갈 것인가. 승인된 경로의 고도이고, 지상에 있어도 승인만 있으면 보입니다.
      // 관제사가 보는 그 숫자입니다 — 경로와 고도가 같이 있어야 승인이 읽힙니다.
      const cruise = v.route?.length ? Number(v.route[0].alt_m) : Number(v.alt_m) > 1 ? Number(v.alt_m) : null;
      features.push({
        type:"Feature",
        geometry:{type:"Point", coordinates:point},
        properties:{id:v.id, heading,
          // 멈춰서 무언가 하는 중이면 그게 무엇인지, 얼마나 남았는지 옆에 씁니다.
          work: workLabel(v), tone: TONE[v.state] || "#c8d4de",
          altitude: cruise === null ? "" : `↑ ${Math.round(cruise)} m`},
      });
      const altitude = roofLifted(point[1], point[0], Number(v.alt_m ?? 0));
      if (visible(world)){
        for (const part of droneBody(point[1], point[0], altitude, heading))
          craft.push(extrusion(part, {world}));
        for (const box of cargoStack(point[1], point[0], altitude, Number(v.load) || 0))
          cargo.push(extrusion(box, {}));
      }

    }
    map.getSource(world)?.setData(
      {type:"FeatureCollection", features: visible(world) ? features : []});
  }
  map.getSource("flightpath")?.setData({type:"FeatureCollection", features:ribbons});
  map.getSource("craft")?.setData({type:"FeatureCollection", features:craft});
  map.getSource("cargo")?.setData({type:"FeatureCollection", features:cargo});
}

/** 점이 고리 안에 있나. 교차 횟수 홀짝 — 바닥 다각형 하나 고르는 데는 이걸로 충분합니다. */
function insideRing(ring, lon, lat){
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++){
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
/** 점에서 고리의 변까지 가장 짧은 거리(m). 올라선 동이 없을 때 곁의 동을 고르는 용도. */
function ringGapM(ring, lon, lat){
  const scale = Math.cos(lat * Math.PI / 180) || 1;
  const px = lon * scale, py = lat;
  let best = Infinity;
  for (let i = 0; i < ring.length - 1; i++){
    const ax = ring[i][0] * scale, ay = ring[i][1], bx = ring[i + 1][0] * scale, by = ring[i + 1][1];
    const dx = bx - ax, dy = by - ay, len2 = dx * dx + dy * dy;
    const u = len2 > 0 ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2)) : 0;
    best = Math.min(best, Math.hypot(px - (ax + u * dx), py - (ay + u * dy)) * 111320);
  }
  return best;
}
/** 고리의 넓이(도수 단위 상대값). 곁의 동 여럿 중 큰 것을 고르는 데만 씁니다. */
function ringArea(ring){
  let twice = 0;
  for (let i = 0; i < ring.length - 1; i++)
    twice += ring[i][0] * ring[i + 1][1] - ring[i + 1][0] * ring[i][1];
  return Math.abs(twice) / 2;
}
/** 옥상 자리 위에 선 기체의 화면 고도. 시뮬레이터 고도는 지면 기준이라 옥상(9 m) 안에 파묻혀 보였습니다.
 * 자리 12 m 안에 있고 실제 고도가 옥상보다 낮으면 옥상 위 0.8 m 로 올려 그립니다. 뜬 뒤에는 그대로입니다. */
function roofLifted(lat, lon, altM){
  const seats = latest?.worlds?.guarded?.seat_coords || [];
  for (const seat of seats){
    const ground = Number(seat.ground_m) || 0;
    if (!ground || altM >= ground + 0.8) continue;
    const dLat = (lat - seat.lat) * 111320, dLon = (lon - seat.lon) * 111320 * Math.cos(lat * Math.PI / 180);
    if (Math.hypot(dLat, dLon) <= 12) return ground + 0.8;
  }
  return altM;
}
let depotPainted = false;
// 매 스냅샷마다 시도합니다. 화면이 매 프레임 다시 그려서 지도가 idle 이 되는 순간이 없습니다.
// 창고와 자리가 다 화면 안에 들어온 채로 타일이 그려졌을 때 한 번 칠하고 끝냅니다.
function paintDepotBuilding(){
  if (depotPainted || !map.getLayer?.("apartments") || !map.queryRenderedFeatures) return;
  const world = latest?.worlds?.guarded;
  const depot = world?.depot_coords;
  if (!depot) return;
  // 창고 표지와 기체 자리 넷 밑의 건물. 자리는 창고 지붕 위에 한 줄이라 그 건물들이 곧 창고입니다.
  const spots = [depot, ...(world.seat_coords || [])];
  const canvas = map.getCanvas();
  const hits = new Map();
  let offscreen = 0;
  for (const spot of spots){
    const point = map.project([spot.lon, spot.lat]);
    if (!(point.x >= 0 && point.y >= 0 && point.x <= canvas.clientWidth && point.y <= canvas.clientHeight)){
      offscreen += 1;
      continue;
    }
    const layers = map.getLayer("footprints") ? ["footprints"] : ["apartments"];
    // 점 밑, 없으면 둘레 40 픽셀. 마당에 선 자리라면 곁의 동을 고르기 위해서입니다.
    const found = map.queryRenderedFeatures(point, {layers});
    if (!found.length)
      found.push(...map.queryRenderedFeatures([[point.x - 40, point.y - 40], [point.x + 40, point.y + 40]], {layers}));
    for (const hit of found) hits.set(hit.id ?? JSON.stringify(hit.geometry.coordinates[0][0]), hit);
  }
  if (!hits.size) return;
  // 타일의 건물 하나가 단지 전체(다중 다각형)일 수 있습니다. 창고나 자리가 실제로 올라선 동만 칠하고,
  // 올라선 동이 없으면(자리가 마당이면) 가장 가까운 동 하나만.
  const features = [], candidates = [];
  for (const hit of hits.values()){
    const polygons = hit.geometry.type === "MultiPolygon" ? hit.geometry.coordinates
      : hit.geometry.type === "Polygon" ? [hit.geometry.coordinates] : [];
    for (const polygon of polygons){
      const feature = {type:"Feature", geometry:{type:"Polygon", coordinates:polygon},
        properties:{height:Number(hit.properties?.render_height) || 10,
                    base:Number(hit.properties?.render_min_height) || 0}};
      if (spots.some(spot => insideRing(polygon[0], spot.lon, spot.lat))) features.push(feature);
      else candidates.push({feature, gap:ringGapM(polygon[0], depot.lon, depot.lat), area:ringArea(polygon[0])});
    }
  }
  if (!features.length){
    // 표지 둘레 60 m 안의 동 가운데 가장 큰 것. 가장 가까운 것은 창고 옆 헛간이었습니다.
    const beside = candidates.filter(c => c.gap <= 60).sort((a, b) => b.area - a.area)[0];
    if (beside) features.push(beside.feature);
  }
  if (!features.length) return;
  map.getSource("depot-building")?.setData({type:"FeatureCollection", features});
  map.setLayoutProperty("depot-marker", "visibility", "none");
  depotPainted = offscreen === 0;
}

function extrusion(piece, properties){
  // 높이는 숫자여야 합니다. null 이 스타일 식(["get","height"])에 닿으면 MapLibre 가 경고를 찍습니다.
  const number = value => (Number.isFinite(Number(value)) ? Number(value) : 0);
  return {type:"Feature", properties:{...properties, base:number(piece.base), height:number(piece.height), column:!!piece.column},
          geometry:{type:"Polygon", coordinates:[piece.polygon]}};
}

async function getJSON(url){
  const response = await fetch(url, {signal:AbortSignal.timeout(3000)});
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  return response.json();
}

async function poll(){
  const started = performance.now();
  try {
    const [sim, rt] = await Promise.allSettled([
      getJSON(`${SIM}/compare`), getJSON(`${RT}/state`),
    ]);
    if (sim.status === "fulfilled"){
      lastRuntime = rt.status === "fulfilled" ? rt.value : null;
      renderSnapshot(sim.value, lastRuntime);
    }
    else if (rt.status === "fulfilled") {
      renderFeed(rt.value);
      renderDenials(rt.value, performance.now());
      renderAdvisories(rt.value, performance.now());
    }
  } catch (error) { console.error("지도 갱신 실패", error); }
  finally { setTimeout(poll, Math.max(0, POLL_MS - (performance.now() - started))); }
}

function renderSnapshot(data, runtime){
  lastRuntime = runtime || lastRuntime;   // 출처 표시(tierOf)가 모델 목록을 여기서 봅니다
  if (latest && (data.round !== latest.round || data.tick < latest.tick)){
    motion.clear(); flights.clear(); stages = []; queued.clear(); seenDenials.clear();
    seenAdvisories.clear(); advisoryUntil = 0;
    denialUntil = 0; roundStartedAt = Date.now() / 1000;
    map.getSource("flightpath")?.setData(empty());
  }
  latest = data;
  document.getElementById("tick").textContent = data.tick;

  const now = performance.now();
  for (const world of ["guarded","direct"]){
    for (const v of Object.values(data.worlds[world].assets)){
      const key = `${world}:${v.id}`;
      const previous = motion.get(key);
      const route = v.route || [];
      let flight = flights.get(key);
      if (route.length && (!flight || !isRemainingRoute(flight.remaining, route))){
        flight = {curve:makeCurve({...v, alt_m:roofLifted(v.lat, v.lon, Number(v.alt_m ?? 0))}, route),
                  remaining:route, progress:0};
        flights.set(key, flight);
      }
      if (flight){
        const to = routeProgress(flight.curve, v, flight.progress);
        const from = previous?.curve === flight.curve
          ? previous.from + (previous.to - previous.from) * Math.min(1, (now - previous.at) / POLL_MS)
          : to;
        motion.set(key, {curve:flight.curve, from, to, at:now});
        flight.progress = to;
        flight.remaining = route;
        if (!route.length) flights.delete(key);
      } else {
        motion.set(key, {start:previous ? motionPoint(previous, now, POLL_MS) : [v.lon,v.lat],
          end:[v.lon,v.lat], at:now});
      }
    }
  }

  // 실제 FAA 격자. 천장이 낮을수록 붉고, 금지 칸은 빗금 없이 진하게.
  // 같은 등급 칸을 합친 덩어리를 씁니다. 격자로 안 보이게.
  const bands = data.worlds.guarded.bands || [];
  map.getSource("cells")?.setData({type:"FeatureCollection", features: bands.map(b => {
    const rings = (b.rings || [b.polygon]).map(closedRing);
    return {
      type:"Feature",
      geometry:{type:"MultiPolygon", coordinates: rings.map(r => [r])},
      properties:{name:b.name, rule:b.rule, ceiling: b.ceiling_m == null ? 0 : b.ceiling_m},
    };
  })});

  // 런타임이 막는 폴리곤 그대로 그립니다. 예전에는 여기서 원을 그렸는데,
  // 그 원은 실제로 금지된 구역과 다른 자리에 있었습니다.
  // 런타임이 지금 걸어 둔 공지 구역도 같이 칠합니다(applied 만 — 보류 중인 것은 아무것도 안 막습니다).
  // 시뮬레이터가 아는 구역과 같은 id 면 한 번만.
  const zone = data.worlds.guarded.zone;
  const zoneFeatures = zone?.active && zone.polygon?.length
    ? [{type:"Feature", properties:{id:zone.id},
        geometry:{type:"Polygon", coordinates:[closedRing(zone.polygon)]}}]
    : [];
  for (const n of (runtime?.notices || [])){
    if (!n.applied || !(n.polygon?.length > 2) || (zone?.active && n.id === zone.id)) continue;
    zoneFeatures.push({type:"Feature", properties:{id:n.id},
      geometry:{type:"Polygon", coordinates:[closedRing(n.polygon)]}});
  }
  map.getSource("zone")?.setData({type:"FeatureCollection", features: zoneFeatures});

  const areas = data.worlds.guarded.landing_areas || [];
  map.getSource("landing")?.setData({type:"FeatureCollection", features: areas.map(a => ({
    type:"Feature", geometry:{type:"Point", coordinates:[a.lon, a.lat]},
    properties:{name:a.name, tag:t("lg_landing")}}))});
  map.getSource("landing-disc")?.setData({type:"FeatureCollection", features: areas.map(a => ({
    type:"Feature", geometry:{type:"Polygon", coordinates:[groundDisc(a.lat, a.lon, 30)]},
    properties:{name:a.name}}))});

  const depot = data.worlds.guarded.depot_coords;
  map.getSource("depot")?.setData({type:"FeatureCollection", features:depot ? [{
    type:"Feature", geometry:{type:"Point", coordinates:[depot.lon,depot.lat]}, properties:{},
  }] : []});
  map.getSource("seats")?.setData({type:"FeatureCollection",
    features:(data.worlds.guarded.seat_coords || []).map((seat, index) => ({
      type:"Feature", geometry:{type:"Polygon", coordinates:[groundDisc(seat.lat, seat.lon, 7)]},
      properties:{name:seat.asset ? `${t("lg_bay", index + 1)} · ${seat.asset}` : t("lg_bay", index + 1),
                  base:Number(seat.ground_m) || 0, height:(Number(seat.ground_m) || 0) + 0.4}}))});

  const g = data.worlds.guarded.scoreboard, d = data.worlds.direct.scoreboard;
  document.getElementById("rows").innerHTML = ROWS.map(key =>
    `<tr><td>${t(key)}</td>
         <td class="${g[key]?'hit':'zero'}">${g[key] ?? 0}</td>
         <td class="${d[key]?'hit':'zero'}">${d[key] ?? 0}</td></tr>`).join("");

  if (runtime) { renderFeed(runtime); renderDenials(runtime, now); renderAdvisories(runtime, now); }
  paintDepotBuilding();

  // 지금 걸려 있는 공지. 무슨 규칙이 언제 도착했고 무엇을 막는지 그대로 씁니다.
  // 공지는 문장으로 옵니다. 런타임이 읽어서 구역으로 만든 것(notices)이 있으면 그것을 쓰고,
  // 아직 못 읽은 문장은 문장 그대로 보입니다 — 읽었는지 자체가 화면에 나와야 합니다.
  const banner = document.getElementById("banner");
  const bulletins = data.bulletins || [];
  // 걸린 것, 사람을 기다리는 것, 그리고 사람이 확인했지만 창이 아직 안 열린 것. 마지막을 빼면 확인한
  // 공지가 '아직 못 읽음' 으로 보입니다.
  const notices = (runtime?.notices || []).filter(n => n.applied || n.held || n.source === "human");
  const known = new Set(notices.map(n => n.id));
  const lines = notices.map(noticeLine);
  for (const b of bulletins){
    if (b.kind === "zone") lines.push(t("b_zone", b.published_tick, b.until_tick, b.name || b.id));
    else if (b.kind === "notam"){
      if (!known.has(b.id)) lines.push(t("b_notam_raw", b.published_tick, b.until_tick, safe(b.text || b.id)));
    } else lines.push(t("b_recall", b.published_tick, b.until_tick, b.applies_to?.model || b.id));
  }
  banner.style.display = lines.length ? "block" : "none";
  banner.innerHTML = lines.join("<br>");
}

/** 누가 공지를 읽었는가. 원장에는 model id 가 남고 화면에는 티어 한 단어만. */
function noticeSource(source){
  const s = String(source || "");
  if (s.startsWith("model:")) return t("src_model", tierOf(s.slice(6)) || t("drafter_model"));
  if (s === "human") return t("src_human");
  return t("src_grammar");
}
function noticeLine(n){
  const name = safe(n.name || n.id);
  if (n.held) return t("b_notam_held", name, noticeSource(n.source));
  if (!n.applied) return t("b_notam_confirmed", n.from_tick ?? "—", n.until_tick ?? "∞", name, noticeSource(n.source));
  return t("b_notam", n.from_tick ?? "—", n.until_tick ?? "∞", name, noticeSource(n.source));
}

const ROUTED = ["fly_route", "reserve_pad"];

// 누가 썼고 무엇으로 그렸는가. 원장에는 모델 id 가 그대로 남고, 화면에는 티어 한 단어만.
// 규칙이 쓴 것은 아무 표시도 안 합니다 — 표시가 없으면 규칙입니다.
function tierOf(author){
  if (!author || author === "rules" || author === "runtime") return "";
  const models = lastRuntime?.llm?.models || {};
  for (const [tier, id] of Object.entries(models))
    if (id && author === id) return tier;
  return t("drafter_model");
}
function drafterWord(params, legs){
  const d = String(params?.drafter || "");
  if (d.startsWith("nano")) return t("drafter_nano");
  if (d === "astar") return t("drafter_astar");
  if (d === "straight" || (!d && (legs?.length || 0) === 2)) return t("drafter_straight");
  return d ? t("drafter_model") : "";
}
// 승인 문구는 판정 코드에서 나옵니다. "APPROVED · RUNTIME" 은 아무 정보도 아니었습니다.
function approvedWord(decision, params){
  // 교차 때문에 고도를 올리거나 앞 기체를 기다린 승인은 그 방법을 씁니다.
  if (params?.resolution === "altitude" && params.altitude_shift_m)
    return t("res_altitude", Math.round(params.altitude_shift_m));
  if (params?.resolution === "delay" && params.holding_for)
    return t("res_delay", params.holding_for);
  const arbiter = decision?.arbiter && String(decision.arbiter).startsWith("ultra") ? " · ultra" : "";
  if (decision?.approved_by) return `${decision.approved_by}${arbiter}`;
  const code = decision?.code || "";
  if (code === "within_limits") return t("r_within_limits") + arbiter;
  if (code === "resource_granted") return t("r_resource_granted", decision.detail?.resource || "") + arbiter;
  return (decision?.reason || t("r_within_limits")) + arbiter;
}
function renderLlmLine(runtime){
  const line = document.getElementById("llm-line");
  if (!line) return;
  const llm = runtime?.llm;
  line.textContent = llm?.enabled
    ? t("llm_on", Object.entries(llm.models || {}).filter(([, id]) => id).map(([tier]) => tier).join(" · "),
        llm.host || "api")
    : t("llm_off");
}

function renderDenials(runtime, now){
  const closed = runtime.ledger.filter(e => e.outcome !== "pending");
  const recent = closed.filter(e => !seenDenials.has(e.id) &&
    e.at >= roundStartedAt && Date.now() - e.at * 1000 < DENIAL_MS);
  // Keep the current ledger window plus staged routes, without unbounded history.
  seenDenials = new Set([...closed.map(e => e.id), ...stages.map(s => s.id)]);
  // 원장은 최신이 앞입니다. 그대로 큐에 넣으면 승인이 거절보다 먼저 재생되어
  // 순서가 뒤집힙니다 — 일어난 순서대로 다시 세웁니다.
  for (const e of [...recent].sort((a, b) => a.at - b.at)) stageRoute(e, now);
  // 거절만이 아니라 회수도 사람이 봐야 할 일입니다. 이미 승인해서 날고 있는 기체를
  // 규칙이 도착해서 되돌리는 것 — 화면에서 기체가 실제로 방향을 트는 그 순간입니다.
  const recalled = e => e.proposal.author === "runtime" && e.decision.policy_hit;
  // '직전에 같은 신청' 거절은 사람이 볼 일이 아닙니다. 원장에는 남고 카드에는 안 뜹니다.
  const fresh = recent.filter(e => (e.decision.verdict === "denied" && e.decision.code !== "duplicate")
                                   || recalled(e));
  if (!fresh.length) return;
  const e = fresh[0], params = e.proposal.params || {};
  const pulled = recalled(e), withdrawn = e.decision.code === "withdrawn";
  const tag = document.querySelector("#denial .tag");
  tag.textContent = withdrawn ? t("d_withdraw") : pulled ? t("d_recall") : t("d_reject");
  tag.className = pulled ? "tag t-human" : "tag t-deny";
  document.getElementById("denial").style.borderColor =
    pulled ? "var(--warn)" : "var(--zone)";
  document.getElementById("denial-who").textContent = e.proposal.asset_id;
  const card = document.getElementById("denial");
  if (card.dataset) card.dataset.asset = e.proposal.asset_id;
  document.getElementById("denial-what").textContent = t(e.proposal.action);
  // 런타임이 값으로 남긴 것을 조립합니다. 문장을 다시 뜯지 않습니다.
  document.getElementById("denial-why").textContent = pulled && !withdrawn
    ? `${t("d_pulled")} — ${reasonText(e)}`
    : reasonText(e);
  const floor = Math.round(Number(params.blocked_floor_m) || 0);
  const top = Math.round(Number(params.blocked_ceiling_m) || 0);
  const source = params.blocked_volume || e.decision.policy_hit || "";
  const notes = [params.blocked_volume && params.blocked_leg ? `${floor}–${top || "∞"} m AGL` : "",
                 source ? t("rule_source", source) : "",
                 fresh.length > 1 ? t("d_more", fresh.length - 1) : ""];
  document.getElementById("denial-more").textContent = notes.filter(Boolean).join(" · ");
  document.getElementById("denial").hidden = false;
  denialUntil = now + DENIAL_MS;
}

/** 선택지 한 줄. 런타임은 id 와 값(until_tick, shift_m)만 주고 문구는 언어에 따라 여기서 만듭니다. */
function optionLabel(option){
  const o = option || {};
  const key = `opt_${o.id}`;
  if (!(TEXT.en[key])) return safe(o.label || o.id || "");
  return t(key, o.id === "climb" ? Math.round(Number(o.shift_m) || 30) : o.until_tick ?? "—");
}

/** 관제 권고 카드. /state.advisories 는 기체마다 마지막 것이라, 원장 번호로 새것만 띄웁니다. */
function renderAdvisories(runtime, now){
  const fresh = (runtime?.advisories || []).filter(a => a.ledger_id && !seenAdvisories.has(a.ledger_id)
    && (!roundStartedAt || (a.at ?? 0) >= roundStartedAt) && Date.now() - (a.at ?? 0) * 1000 < ADVISORY_MS);
  for (const a of fresh) seenAdvisories.add(a.ledger_id);
  if (!fresh.length) return;
  const a = fresh.sort((x, y) => (x.at ?? 0) - (y.at ?? 0)).at(-1);
  const card = document.getElementById("advisory");
  if (card.dataset) card.dataset.asset = a.asset;
  document.getElementById("advisory-tag").textContent = t("adv_tag");
  document.getElementById("advisory-who").textContent = a.asset;
  const source = a.source === "super" ? t("adv_src_super") : t("adv_src_rules");
  const count = (a.refusals || []).length;
  document.getElementById("advisory-source").textContent =
    `${source} · ${t(a.trigger === "decline_after_refusals" ? "adv_after_decline" : "adv_after", count)}`;
  const chosen = (a.options || []).find(o => o.id === a.chosen);
  // 모델(super)이 쓴 요약은 그대로, 규칙이 고른 것은 화면 말로 조립합니다.
  document.getElementById("advisory-summary").textContent = a.source === "super" && a.summary
    ? a.summary
    : t(a.trigger === "decline_after_refusals" ? "adv_template_decline" : "adv_template",
        a.asset, count, optionLabel(chosen || {id:a.chosen}));
  document.getElementById("advisory-options").innerHTML = (a.options || []).map(o =>
    `<li class="${o.legal ? "ok" : "no"}${o.id === a.chosen ? " chosen" : ""}">${optionLabel(o)} · ${
      o.legal ? t("adv_legal") : t("adv_illegal")}${o.why && !o.legal ? ` — ${safe(o.why)}` : ""}</li>`).join("");
  document.getElementById("advisory-note").textContent = t("adv_note");
  card.hidden = false;
  advisoryUntil = now + ADVISORY_MS;
}

/** 닫힌 결정 하나를 되짚어 그릴 구간으로 등록합니다. 좌표는 신청서에 실린 그대로입니다. */
function stageRoute(entry, now){
  const legs = entry.proposal.params?.legs;
  if (!ROUTED.includes(entry.proposal.action) || !(legs?.length > 1)) return;
  const decision = entry.decision, verdict = decision.verdict;
  // 사람에게 간 것(human)은 아직 오간 경로가 아닙니다 — 이제 원장에 남으므로 승인으로 그리면 안 됩니다.
  const kind = verdict === "denied" ? "rejected" : verdict === "auto" ? "approved" : null;
  if (!kind) return;   // 대기 중인 것은 아직 오간 경로가 아닙니다
  // 같은 신청을 두 번 낸 것은 길이 막힌 게 아닙니다. 원장에는 경유점째 남지만 다시 그리지 않습니다.
  if (decision.code === "duplicate") return;
  const params = entry.proposal.params || {};
  const by = approvedWord(decision, params);
  // 한 기체에 한 선만. 앞 구간이 완전히 사라진 다음에 다음 구간이 시작합니다.
  // 노란 선 → 거절되어 회수 → 그 다음에 새 노란 선 → 승인. 절대 겹치지 않습니다.
  // 시뮬레이터도 이 재생이 끝날 때까지 기체를 잡아둡니다(CLEARANCE_TICKS).
  const asset = entry.proposal.asset_id;
  // 재생은 지상 출발에만 합니다. 나는 중에 경로가 바뀌면(회수 뒤 재경로) 기체는 이미 움직이고
  // 있어서, 옛 자리에서 노란 선을 다시 그리면 기체와 따로 노는 선이 하나 더 생깁니다.
  // 그 경우 비행 회랑이 바로 새 경로로 바뀌는 것으로 충분합니다.
  if (Number(latest?.worlds?.guarded?.assets?.[asset]?.alt_m) > 1) return;
  // 재생은 실시간보다 한 단계까지만 뒤처집니다. 거절이 12초마다 다섯 건씩 오면 큐가 한없이
  // 밀려 화면이 한참 전 일을 보여주게 되므로, 밀린 예약은 버리고 지금 도는 단계 뒤에 붙입니다.
  const playing = stages.filter(s => s.asset === asset && s.at <= now);
  const playingEnd = Math.max(now, ...playing.map(s => s.at + stageLife(s.kind)));
  const backlog = (queued.get(asset) || 0) - playingEnd;
  if (backlog > 0){
    stages = stages.filter(s => s.asset !== asset || s.at <= now);
    queued.set(asset, playingEnd);
  }
  const at = Math.max(now, queued.get(asset) || 0);
  queued.set(asset, at + stageLife(kind));
  // 공역 때문에 거절된 것만 '무엇이 막았는가'를 그 자리에 그립니다. 이륙장이 잡혀 있거나
  // 감항성 지시로 못 뜨는 것은 길이 막힌 게 아니라서, 그 이유를 글자로만 씁니다.
  const airspace = decision.code === "airspace";
  stages.push({
    id:entry.id, asset, kind, at, by, params, filed:entry.at,
    reason: airspace ? blockedLabel(params) : reasonText(entry),
    drafter: drafterWord(params, legs),
    curve:makeCurve({...legs[0], alt_m:roofLifted(legs[0].lat, legs[0].lon, Number(legs[0].alt_m ?? 0))},
                    legs.slice(1)),
    blocker: airspace && params.blocked_polygon?.length ? {
      polygon: params.blocked_polygon,
      // 건물만 높이를 가집니다. 구역·격자는 0 → 바닥 채색.
      height: String(params.blocked_volume || "").startsWith("bldg-")
        ? Number(params.blocked_ceiling_m) || 0 : 0,
    } : null,
    breach: airspace && params.blocked_at ? {at: params.blocked_at, params} : null,
  });
}

/**
 * 노란 회랑을 앞으로 그린 뒤 같은 도형의 색만 바꿉니다.
 * 재생 중에는 실제 비행 회랑을 감춰 한 기체에 한 경로만 보입니다.
 */
const PHRASE = {drawing:"ph_drawing", checking:"ph_checking", refused:"ph_refused"};
// 멈춰 있는 이유를 화면에 씁니다. 나는 중에는 아무것도 안 붙입니다.
const WORKING = new Set(["dropping", "loading", "picking", "ready", "landing", "charging", "landed",
                         "stranded", "diverted"]);
// 상태마다 색. 적재 호박, 하역 초록, 착륙 파랑, 충전 노랑, 대기는 흰색에 가깝게.
const TONE = {loading:"#ffb84d", picking:"#ffb84d", dropping:"#7ff0ae", ready:"#eef3f7", landing:"#8ec5ff",
              landed:"#cfd8e0", charging:"#ffd23f", cruising:"#c8d4de"};

/** 기체 옆 상태 문구. 진행도가 있는 상태는 숫자까지 — 상자 몇 개, 배터리 몇 %. */
function workLabel(v){
  switch (v.state){
    case "loading": return `${t("loading")} ${Number(v.load) || 0}/${CARGO_MAX}`;
    case "dropping": return `${t("dropping")} ${Number(v.load) || 0}`;
    case "picking": return `${t("picking")} ${Number(v.load) || 0}`;
    // 지상에서 승인을 기다리는 동안은 한 단어만. 무슨 일이 되어 가는지는 그 기체에서
    // 뻗어 나가는 경로의 글자(산출중·판정 대기·거절·승인)가 말해 줍니다.
    case "ready": return v.holding_for ? t("holding_for", v.holding_for) : t("ready");
    case "charging": return `${t("charging")} ${Math.round(v.battery)}%`;
    // 공중에서 승인된 경로 없이 떠 있으면 무엇을 기다리는지 씁니다. 그냥 '대기'는 안 읽힙니다.
    case "cruising": return Number(v.alt_m) > 1 && !v.route?.length ? t("awaiting_route") : "";
    case "returning": return t("returning");
    default: return WORKING.has(v.state) ? t(v.state) : "";
  }
}

/** 판정 사유를 화면 말로. 런타임은 코드와 값만 주고 문구는 여기서 만듭니다. */
function reasonText(entry){
  const d = entry.decision, x = d.detail || {}, params = entry.proposal.params || {};
  switch (d.code || ""){          // 코드가 없는 결정은 런타임이 준 문장을 그대로 씁니다
    case "airspace": return ENDPOINTS.has(params.blocked_kind)
      ? blockedLabel(params) : t("r_airspace", params.blocked_leg, blockedLabel(params));
    case "withdrawn": return t("r_withdrawn", x.for || params.withdrawn_for || "—");
    case "nonconforming": return t("r_nonconforming", params.actual_depart_tick ?? "—",
                                   x.planned_depart_tick ?? params.planned_depart_tick ?? "—");
    case "policy": return t("r_policy", x.policy);
    case "human_action": return t("r_human_action", t(x.action) || x.action);
    case "human_blast": return t("r_human_blast", x.blast);
    case "over_asset": return t("r_over_asset", x.spent, x.cap);
    case "over_fleet": return t("r_over_fleet", x.spent, x.cap);
    case "resource_held": return t("r_resource_held", x.resource, x.holder || "—");
    case "resource_granted": return t("r_resource_granted", x.resource);
    case "recalled": return t("r_recalled", x.resource, x.policy);
    case "advisory": return t("r_advisory", optionLabel((params.options || []).find(o => o.id === x.chosen)
                                                        || {id:x.chosen})) + (x.source === "super" ? " · super" : "");
    case "notice_unreadable": return t("r_notice_unreadable", x.why || "");
    case "notice_published": return t("r_notice_published");
    case "notice_refused": return t("r_notice_refused");
    case "": return d.reason;
    default: return t(`r_${d.code}`);
  }
}

/** 무엇이 막았는지를 화면 말로. 런타임은 값만 주고 문구는 여기서 만듭니다. */
const ENDPOINTS = new Set(["origin", "destination"]);
function blockedLabel(params){
  const id = params.blocked_volume || "";
  const height = Math.round(Number(params.blocked_ceiling_m) || 0);
  // 경로의 양끝이 기체·목적지와 안 맞으면 판정 밖을 나는 구간이 생깁니다. 막은 건 물체가 아니라 간격입니다.
  if (ENDPOINTS.has(params.blocked_kind))
    return t(params.blocked_kind === "origin" ? "blk_origin" : "blk_destination",
             Math.round(Number(params.blocked_gap_m) || 0));
  if (params.blocked_kind === "traffic") return t("blk_traffic", params.blocked_asset || "");
  if (params.blocked_kind === "takeoff" || params.blocked_kind === "column")
    return t(params.blocked_kind === "takeoff" ? "blk_takeoff" : "blk_column",
             id.startsWith("bldg-") ? t("blk_building", height) : params.blocked_name || id);
  if (params.blocked_kind === "landing")
    return t("blk_landing", id.startsWith("bldg-") ? t("blk_building", height)
             : params.blocked_name || id || params.blocked_asset || "");
  if (id.startsWith("bldg-")) return t("blk_building", height);
  if (params.blocked_kind === "ceiling") return t("blk_ceiling", height);
  if (id.startsWith("uasfm-")) return t("blk_grid");
  if (id.startsWith("nofly-")) return t("blk_zone");
  return params.blocked_name || t("blk_other");
}

function drawStages(now, corridors){
  const blockers = [], breaches = [], labels = [];
  const growing = new Set(stages.map(stage => stage.asset));
  for (const stage of stages){
    const elapsed = now - stage.at;
    const window = stageWindow(stage.kind, elapsed);
    if (!window || !visible("guarded")) continue;
    const total = stage.curve.progress.at(-1);
    if (!(total > 0) || window[1] - window[0] < 1e-3) continue;
    const phase = stagePhase(stage.kind, elapsed);
    // 판정 전후 모두 같은 공중 도형입니다. 색과 불투명도만 바뀝니다.
    const band = phase === "approved" ? "approved" : phase === "refused" ? "rejected" : "pending";
    for (const piece of [...curveColumns(stage.curve, window[0] * total, window[1] * total),
                         ...curveRibbon(stage.curve, window[0] * total, window[1] * total)])
      corridors.push(extrusion(piece, {asset:stage.asset, phase:band}));
    const headline =
      phase === "approved" ? `${t("ph_approved")} · ${stage.by}`
      : phase === "refused" ? `${t("ph_refused")} · ${stage.reason}`
      : phase === "drawing" && stage.drafter ? `${t(PHRASE[phase])} · ${stage.drafter}`
      : t(PHRASE[phase]);
    labels.push({type:"Feature",
      properties:{kind: phase === "approved" ? "approved"
                      : phase === "refused" ? "rejected" : "pending",
        label: headline},
      // 선 끝을 따라다니면 글자가 계속 움직여서 읽을 수가 없습니다. 출발점에 고정합니다.
      geometry:{type:"Point", coordinates:labelAnchor(stage.curve)}});
    const alpha = stageFade(stage.kind, elapsed);
    let opacity = 1;
    if (phase === "approved" || phase === "refused"){
      const duration = stage.kind === "approved" ? APPROVED_HOLD_MS : HOLD_MS;
      const step = (elapsed - GROW_MS - CHECK_MS) / duration;
      const blink = step < 1 ? .3 + .7 * Math.abs(Math.cos(step * Math.PI * 3)) : 1;
      opacity = blink * (stage.kind === "rejected" ? alpha : 1);
    }
    corridorAlpha(stage.asset, opacity);
    // 교차 거절이면 누구와 교차하는지 — 그 기체의 회랑이 같이 깜빡입니다.
    if (phase === "refused" && stage.params?.blocked_kind === "traffic" && stage.params.blocked_asset)
      corridorAlpha(stage.params.blocked_asset, opacity);
    // 막은 것 역시 판정 뒤에만 드러납니다.
    if (phase === "refused"){
      if (stage.blocker) blockers.push({
        type:"Feature", properties:{height:stage.blocker.height},
        geometry:{type:"Polygon", coordinates:[closedRing(stage.blocker.polygon)]}});
      if (stage.breach) breaches.push({
        type:"Feature", properties:{label:blockedLabel(stage.breach.params)},
        geometry:{type:"Point", coordinates:[stage.breach.at.lon, stage.breach.at.lat]}});
    }
  }
  map.getSource("blocker")?.setData({type:"FeatureCollection", features:blockers});
  map.getSource("breach")?.setData({type:"FeatureCollection", features:breaches});
  map.getSource("stage-label")?.setData({type:"FeatureCollection", features:labels});
  return {growing};
}

const corridorLayers = new Map();
/** MapLibre의 extrusion opacity는 레이어 단위이므로 기체별로 분리합니다.
 * 소스/도형은 한 벌이며 phase를 바꿔도 레이어를 다시 만들지 않습니다. */
function corridorAlpha(asset, value){
  if (!map.getSource("flightpath")) return;
  const id = `flightpath:${asset}`;
  const opacity = Math.round(value * 20) / 20 * .85;
  if (!corridorLayers.has(asset)){
    map.addLayer({id, type:"fill-extrusion", source:"flightpath",
      filter:["==",["get","asset"],asset],
      paint:{"fill-extrusion-color":["match",["get","phase"],
          "pending","#ffd23f", "rejected","#ff3b30", "#29c76f"],
        "fill-extrusion-base":["get","base"], "fill-extrusion-height":["get","height"],
        "fill-extrusion-opacity":opacity,
        "fill-extrusion-opacity-transition":{duration:0}}}, "blocker");
  } else if (corridorLayers.get(asset) !== opacity){
    map.setPaintProperty(id, "fill-extrusion-opacity", opacity);
  }
  corridorLayers.set(asset, opacity);
}

function expireDenials(now){
  // 아직 시작 시각이 안 된 단계(앞 단계 뒤로 예약된 것)는 끝난 게 아닙니다. 창이 null 이라고
  // 같이 지웠더니, 빨강이 끝나기 직전에 도착한 승인이 노랑을 못 그리고 초록 회랑만 불쑥 나왔습니다.
  stages = stages.filter(s => now < s.at || stageWindow(s.kind, now - s.at) !== null);
  if (now >= denialUntil) document.getElementById("denial").hidden = true;
  if (now >= advisoryUntil) document.getElementById("advisory").hidden = true;
}

const TAG = {auto:["t-auto","t_auto"], denied:["t-deny","t_denied"],
             human:["t-human","t_human"], queued:["t-human","t_queued"]};

// 디버그 핸들. 밖(playwright)에서 화면 상태를 읽기만 합니다. 여기로 쓰지 않습니다.
if (typeof window !== "undefined")
  window.__attache = {map, motion, flights, queued, api:{sim:SIM, rt:RT},
    get latest(){ return latest; }, get stages(){ return stages; }};

function renderFeed(runtime){
  const seen = new Set(), lines = [];
  for (const entry of runtime.ledger){
    if (entry.outcome === "pending" || seen.has(entry.id)) continue;
    // 지난 판의 기록은 안 보여줍니다. 판을 새로 시작했는데 감항성 지시 거절이 남아 있으면
    // 지금 무슨 일이 있는 줄 압니다.
    if (roundStartedAt && entry.at < roundStartedAt) continue;
    seen.add(entry.id);
    const p = entry.proposal, d = entry.decision;
    const [cls, key] = TAG[d.verdict] || ["t-auto", d.verdict];
    const word = t(key);
    const who = d.approved_by ? ` · ${d.approved_by}` : "";
    const how = d.arbiter && String(d.arbiter).startsWith("ultra") ? " · ultra" : "";
    const tier = tierOf(p.author);
    const wrote = tier ? ` <span class="tier">${safe(tier)}</span>` : "";
    const drafter = ROUTED.includes(p.action) ? drafterWord(p.params, p.params?.legs) : "";
    const drew = drafter && drafter !== t("drafter_straight") ? ` · ${safe(drafter)}` : "";
    const why = d.detail?.arbiter_reason ? `<div class="note">${safe(d.detail.arbiter_reason)}</div>` : "";
    lines.push(`<div class="ev" data-asset="${safe(p.asset_id)}"><span class="tag ${cls}">${word}</span>
      <b>${p.asset_id}</b>${wrote} ${t(p.action)}${drew}
      <div style="color:var(--dim)">${reasonText(entry)}${who}${how}</div>${why}</div>`);
    if (lines.length >= 12) break;
  }
  document.getElementById("feed").innerHTML = lines.join("")
    || `<div class="ev" style="color:var(--dim)">${t("empty")}</div>`;
  renderLlmLine(runtime);
}
</script>
