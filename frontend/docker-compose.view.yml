# Watch the fleet in 3D in the browser.
#
#   docker compose -f docker-compose.local.yml -f frontend/docker-compose.view.yml --env-file .env.local up --build
#   → http://localhost:3200   (Skybrush Live, 3D view)
#   → http://localhost:3100   (the sky-net map)
#
# Why this pair: Docker Desktop on Apple Silicon passes no GPU to Linux containers, so every
# way of drawing 3D inside a container (Gazebo, Webots, Unreal, Isaac) falls back to software
# rendering here. Rendering moves to the browser instead.
# The Skybrush server is pure Python, and the Mac's Metal WebGL draws the view.
#
# Telling the two fleets apart on screen:
#   1. names     SIM-00..02 are the runtime side, SIM-03..05 the direct side; the labels show it
#   2. position  the takeoff grids keep them apart; from any angle they read as two groups
#   Colour would need a separate light program: UAV-SIGNAL switches a signalling device on,
#   it does not set a colour.

x-direct-flock: &direct-flock
  build:
    context: .
    dockerfile: drone/Dockerfile
    target: direct
  networks: [world]
  depends_on: [skybrush]
  restart: unless-stopped

services:
  skybrush:
    build:
      context: .
      dockerfile: frontend/Dockerfile.skybrush
    volumes:
      - ./configs/skybrush.jsonc:/etc/skybrush/skynet.jsonc:ro
    ports:
      - "5000:5000"   # HTTP/WebSocket that Skybrush Live connects to
      - "5001:5001"   # Flockwave over TCP; the runtime connects here
    networks: [fleet, world]

  live:
    build:
      context: .
      dockerfile: frontend/Dockerfile.live
    ports: ["3200:80"]
    networks: [fleet]
    depends_on: [skybrush]

  runtime:
    environment:
      ADAPTER: flockwave
      FLOCKWAVE_HOST: skybrush
      FLOCKWAVE_PORT: 5001
      UAV_IDS: "drone-01=SIM-00,drone-02=SIM-01,drone-03=SIM-02"
    depends_on: [skybrush, sim]

  direct-drone-01:
    <<: *direct-flock
    environment:
      ASSET_ID: drone-01
      TRANSPORT: flockwave
      FLOCKWAVE_HOST: skybrush
      UAV_ID: SIM-03
      SIM_URL: http://sim:8100
      VEHICLE_MODEL: dv-x500

  direct-drone-02:
    <<: *direct-flock
    environment:
      ASSET_ID: drone-02
      TRANSPORT: flockwave
      FLOCKWAVE_HOST: skybrush
      UAV_ID: SIM-04
      SIM_URL: http://sim:8100
      VEHICLE_MODEL: dv-hexa

  direct-drone-03:
    <<: *direct-flock
    environment:
      ASSET_ID: drone-03
      TRANSPORT: flockwave
      FLOCKWAVE_HOST: skybrush
      UAV_ID: SIM-05
      SIM_URL: http://sim:8100
      VEHICLE_MODEL: dv-x500

  # The sim stays: Skybrush flies the aircraft, but recalls and zone notices still come from here.
