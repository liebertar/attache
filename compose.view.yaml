# 브라우저에서 3D 로 봅니다.
#
#   docker compose -f compose.yaml -f compose.view.yaml up --build
#   → http://localhost:3200   (Skybrush Live, 3D 뷰)
#   → http://localhost:3100   (Attaché 승인 화면)
#
# 왜 이 조합인가: Docker Desktop 은 Apple Silicon 에서 리눅스 컨테이너에 GPU 를
# 안 넘깁니다. 컨테이너 안에서 3D 를 그리는 모든 방법(Gazebo, Webots, Unreal, Isaac)이
# 여기서 소프트웨어 렌더링으로 떨어집니다. 그래서 렌더링을 브라우저로 옮깁니다.
# Skybrush 서버는 순수 파이썬이고, 화면은 Mac 의 Metal WebGL 이 그립니다.
#
# 화면에서 두 기단을 가르는 법:
#   1. 이름   SIM-00..02 가 런타임 쪽, SIM-03..05 가 직접 쪽. 라벨로 보입니다
#   2. 위치   이륙 격자가 갈라놓습니다. 어느 각도에서 봐도 두 무리로 보입니다
#   색으로 가르려면 조명 프로그램을 따로 올려야 합니다. UAV-SIGNAL 은 색이 아니라
#   신호 장치를 켜는 명령이라서 그것만으로는 안 됩니다.

x-direct-flock: &direct-flock
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: agent-direct
  networks: [world]
  depends_on: [skybrush]
  restart: unless-stopped

services:
  skybrush:
    build:
      context: .
      dockerfile: docker/Dockerfile.skybrush
    volumes:
      - ./configs/skybrush.jsonc:/etc/skybrush/attache.jsonc:ro
    ports:
      - "5000:5000"   # Skybrush Live 가 붙는 HTTP/WebSocket
      - "5001:5001"   # Flockwave over TCP. 우리가 붙는 곳
    networks: [fleet, world]

  live:
    build:
      context: .
      dockerfile: docker/Dockerfile.live
    ports: ["3200:80"]
    networks: [fleet]
    depends_on: [skybrush]

  runtime:
    environment:
      ADAPTER: flockwave
      FLOCKWAVE_HOST: skybrush
      FLOCKWAVE_PORT: 5001
      UAV_IDS: "drone-01=SIM-00,drone-02=SIM-01,drone-03=SIM-02"
    depends_on: [skybrush, sim]

  direct-drone-01:
    <<: *direct-flock
    environment:
      ASSET_ID: drone-01
      TRANSPORT: flockwave
      FLOCKWAVE_HOST: skybrush
      UAV_ID: SIM-03
      SIM_URL: http://sim:8100
      VEHICLE_MODEL: dv-x500

  direct-drone-02:
    <<: *direct-flock
    environment:
      ASSET_ID: drone-02
      TRANSPORT: flockwave
      FLOCKWAVE_HOST: skybrush
      UAV_ID: SIM-04
      SIM_URL: http://sim:8100
      VEHICLE_MODEL: dv-hexa

  direct-drone-03:
    <<: *direct-flock
    environment:
      ASSET_ID: drone-03
      TRANSPORT: flockwave
      FLOCKWAVE_HOST: skybrush
      UAV_ID: SIM-05
      SIM_URL: http://sim:8100
      VEHICLE_MODEL: dv-x500

  # sim 은 그대로 둡니다. 기체는 Skybrush 가 날리지만 리콜과 구역 공지는 여기서 옵니다.
