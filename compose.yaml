# docker compose up --build  →  지도 http://localhost:3100/map.html · 승인함 http://localhost:3100
#
# 이 파일 자체가 설명입니다. guarded 에이전트는 world 망에 없어서 조종장치에 닿을
# 길이 없고, direct 에이전트는 world 망에 있어서 직접 만집니다. 코드는 같습니다.

x-build-agent: &build-agent
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: agent
  env_file:
    - path: .env
      required: false
  restart: unless-stopped

x-build-direct: &build-direct
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: agent-direct
  env_file:
    - path: .env
      required: false
  restart: unless-stopped

# 모델 설정. 비우면 규칙만으로 돕니다. NEBIUS_API_KEY 만 주면 Token Factory 주소가 채워지고 모델 id 는
# 아래 nvidia/... 기본값입니다(scripts/dev.sh 와 같은 약속). Mac 의 Ollama 를 컨테이너에서 쓰려면 주소를
# host.docker.internal 로 — 런타임은 관제 서버 :11439, 드론은 LLM_URL_1..4 = :11435..:11438 — 주고
# MODEL_NANO·MODEL_SUPER 도 같이 줘야 합니다. 기본값이 Nebius id 라 안 주면 Ollama 가 모르는 모델이라
# 답하고 규칙이 씁니다(.env.example 의 compose 블록).
# 런타임만 Super/Ultra 를 부릅니다(공지 읽기·권고·중재). 드론 에이전트는 Nano 하나뿐입니다.
x-llm: &llm
  LLM_BASE_URL: ${LLM_BASE_URL:-${NEBIUS_API_KEY:+https://api.tokenfactory.nebius.com/v1}}
  NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
  MODEL_NANO: ${MODEL_NANO:-nvidia/Nemotron-3_5-Lightning}
  MODEL_SUPER: ${MODEL_SUPER:-nvidia/nemotron-3-super-120b-a12b}
  # 중재(Ultra)는 MODEL_ULTRA= 로 비우면 꺼집니다(콜론 없는 '-' 라 빈 값이 이깁니다). 로컬 Ollama 에는
  # Ultra 가 없어서, 안 비우면 없는 Nebius id 를 묻고 매번 규칙이 대신합니다.
  MODEL_ULTRA: ${MODEL_ULTRA-nvidia/Nemotron-3-Ultra-550b-a55b}
  LLM_REQUEST_EXTRA: ${LLM_REQUEST_EXTRA:-}
  LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-6}
  LLM_RECORD_DIR: ${LLM_RECORD_DIR:-}

# 드론 에이전트 공통. 드론마다 다른 서버(로컬 함대: scripts/ollama_fleet.sh, 11435..11438)를 쓰려면
# LLM_URL_1..4 를 주고, 안 주면 LLM_BASE_URL 하나를 같이 씁니다. 호스트의 Ollama 는
# http://host.docker.internal:1143x/v1 입니다.
x-agent-llm: &agent-llm
  NEBIUS_API_KEY: ${NEBIUS_API_KEY:-}
  MODEL_NANO: ${MODEL_NANO:-nvidia/Nemotron-3_5-Lightning}
  LLM_REQUEST_EXTRA: ${LLM_REQUEST_EXTRA:-}
  LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-6}
  LLM_RECORD_DIR: ${LLM_RECORD_DIR:-}

services:
  sim:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: sim
    environment:
      PORT: 8100
      SEED: ${SEED:-7}
      FLEET_LIMIT_USD: 720
      TICK_SECONDS: ${TICK_SECONDS:-0.2}
      # 직결 세계 에이전트의 모델 id. 그 에이전트들은 world 망에만 있어 런타임에 등록할 수 없어서
      # 시뮬레이터가 기체마다 싣습니다(agent_model). DIRECT_LLM_URL 을 줬으면 같이 주세요(비면 규칙).
      DIRECT_MODEL: ${DIRECT_MODEL:-}
      # 배차(sim/dispatch.py). 비우면 규칙 배차. DISPATCH=cuopt 와 CUOPT_URL(GPU 가 있는 cuOpt 서버)을
      # 주면 cuOpt 가 짜고, 무엇이든 어긋나면 그 정차는 규칙이 정합니다. 시뮬 이미지에는
      # configs/fleet.yaml 이 없어서 compose 에서는 여기 환경 변수만 배차기를 고릅니다.
      DISPATCH: ${DISPATCH:-}
      CUOPT_URL: ${CUOPT_URL:-}
      CUOPT_TIMEOUT_S: ${CUOPT_TIMEOUT_S:-}
      CUOPT_TIME_LIMIT_S: ${CUOPT_TIME_LIMIT_S:-}
      CUOPT_BACKOFF_S: ${CUOPT_BACKOFF_S:-}
    ports: ["8100:8100"]
    networks: [world]

  runtime:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: runtime
    environment:
      <<: *llm
      PORT: 8000
      CONFIG: /app/configs/fleet.yaml
      SIM_URL: http://sim:8100
      LEDGER_PATH: /data/ledger.jsonl
      ARBITRATION_WINDOW_S: ${ARBITRATION_WINDOW_S:-1.5}
      # 정보 수집. 들어온 것의 기록은 원장과 같은 볼륨에 — 재시작해도 읽은 검색 결과를 다시 읽지 않습니다.
      INTAKE_DB: /data/intake.sqlite
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      INTAKE_PERIOD_S: ${INTAKE_PERIOD_S:-300}
      # METAR 는 키 없이 aviationweather.gov 에서. 끄려면 METAR=off. 관측소는 비우면 configs/fleet.yaml.
      METAR: ${METAR:-on}
      METAR_STATIONS: ${METAR_STATIONS:-}
      METAR_PERIOD_S: ${METAR_PERIOD_S:-300}
    ports: ["8000:8000"]
    volumes: [ledger:/data]
    # 양쪽 망에 다 있는 유일한 서비스입니다
    networks: [fleet, world]
    depends_on: [sim]

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: ui
    ports: ["3100:3000"]
    networks: [fleet]
    depends_on: [runtime]

  # --- 런타임을 거치는 세계 -------------------------------------------------
  guarded-drone-01:
    <<: *build-agent
    environment: { <<: *agent-llm, LLM_BASE_URL: "${LLM_URL_1:-${LLM_BASE_URL:-${NEBIUS_API_KEY:+https://api.tokenfactory.nebius.com/v1}}}",
                   ASSET_ID: drone-01, RUNTIME_URL: "http://runtime:8000" }
    networks: [fleet]
    depends_on: [runtime]

  guarded-drone-02:
    <<: *build-agent
    environment: { <<: *agent-llm, LLM_BASE_URL: "${LLM_URL_2:-${LLM_BASE_URL:-${NEBIUS_API_KEY:+https://api.tokenfactory.nebius.com/v1}}}",
                   ASSET_ID: drone-02, RUNTIME_URL: "http://runtime:8000" }
    networks: [fleet]
    depends_on: [runtime]

  guarded-drone-03:
    <<: *build-agent
    environment: { <<: *agent-llm, LLM_BASE_URL: "${LLM_URL_3:-${LLM_BASE_URL:-${NEBIUS_API_KEY:+https://api.tokenfactory.nebius.com/v1}}}",
                   ASSET_ID: drone-03, RUNTIME_URL: "http://runtime:8000" }
    networks: [fleet]
    depends_on: [runtime]

  guarded-drone-04:
    <<: *build-agent
    environment: { <<: *agent-llm, LLM_BASE_URL: "${LLM_URL_4:-${LLM_BASE_URL:-${NEBIUS_API_KEY:+https://api.tokenfactory.nebius.com/v1}}}",
                   ASSET_ID: drone-04, RUNTIME_URL: "http://runtime:8000" }
    networks: [fleet]
    depends_on: [runtime]


  # --- 조종장치를 직접 만지는 세계 (지금 대부분의 배선) ---------------------
  direct-drone-01:
    <<: *build-direct
    environment: { <<: *agent-llm, LLM_BASE_URL: "${DIRECT_LLM_URL:-}",
                   ASSET_ID: drone-01, TRANSPORT: http, SIM_URL: "http://sim:8100" }
    networks: [world]
    depends_on: [sim]

  direct-drone-02:
    <<: *build-direct
    environment: { <<: *agent-llm, LLM_BASE_URL: "${DIRECT_LLM_URL:-}",
                   ASSET_ID: drone-02, TRANSPORT: http, SIM_URL: "http://sim:8100" }
    networks: [world]
    depends_on: [sim]

  direct-drone-03:
    <<: *build-direct
    environment: { <<: *agent-llm, LLM_BASE_URL: "${DIRECT_LLM_URL:-}",
                   ASSET_ID: drone-03, TRANSPORT: http, SIM_URL: "http://sim:8100" }
    networks: [world]
    depends_on: [sim]

  direct-drone-04:
    <<: *build-direct
    environment: { <<: *agent-llm, LLM_BASE_URL: "${DIRECT_LLM_URL:-}",
                   ASSET_ID: drone-04, TRANSPORT: http, SIM_URL: "http://sim:8100" }
    networks: [world]
    depends_on: [sim]


networks:
  fleet: {}
  world: {}

volumes:
  ledger: {}
