# dev 서버(공유 기계, 예: Nebius VM)에서 스택 전체. 서비스는 로컬 파일에서 그대로 가져오고(extends)
# dev 에 필요한 것만 바꿉니다: 늘 재시작, 비밀은 .env.dev, 원장·접수 기록은 따로 둔 볼륨.
#   cp .env.dev.example .env.dev      # NEBIUS_API_KEY, TAVILY_API_KEY
#   docker compose -f docker-compose.dev.yml --env-file .env.dev up -d --build

name: sky-net

x-dev: &dev
  restart: always
  env_file:
    - path: .env.dev
      required: false

services:
  sim:
    extends: {file: docker-compose.local.yml, service: sim}
    <<: *dev
  runtime:
    extends: {file: docker-compose.local.yml, service: runtime}
    <<: *dev
    depends_on: [sim]
    volumes: [ledger-dev:/data]
  ui:
    extends: {file: docker-compose.local.yml, service: ui}
    <<: *dev
    depends_on: [runtime]
  guarded-drone-01:
    extends: {file: docker-compose.local.yml, service: guarded-drone-01}
    <<: *dev
    depends_on: [runtime]
  guarded-drone-02:
    extends: {file: docker-compose.local.yml, service: guarded-drone-02}
    <<: *dev
    depends_on: [runtime]
  guarded-drone-03:
    extends: {file: docker-compose.local.yml, service: guarded-drone-03}
    <<: *dev
    depends_on: [runtime]
  guarded-drone-04:
    extends: {file: docker-compose.local.yml, service: guarded-drone-04}
    <<: *dev
    depends_on: [runtime]
  direct-drone-01:
    extends: {file: docker-compose.local.yml, service: direct-drone-01}
    <<: *dev
    depends_on: [sim]
  direct-drone-02:
    extends: {file: docker-compose.local.yml, service: direct-drone-02}
    <<: *dev
    depends_on: [sim]
  direct-drone-03:
    extends: {file: docker-compose.local.yml, service: direct-drone-03}
    <<: *dev
    depends_on: [sim]
  direct-drone-04:
    extends: {file: docker-compose.local.yml, service: direct-drone-04}
    <<: *dev
    depends_on: [sim]

networks:
  fleet: {}
  world: {}

volumes:
  ledger-dev: {}
