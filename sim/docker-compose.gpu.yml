# NVIDIA 가 있는 기계에서. Gazebo 3D 창이 GPU 로 제 속도로 돕니다.
#
#   docker compose -f docker-compose.local.yml -f sim/docker-compose.sitl.yml -f sim/docker-compose.gpu.yml up
#
# Mac 과 똑같은 sim/docker-compose.sitl.yml 을 그대로 쓰고, 이 파일이 GPU 만 얹습니다.
# 이미지는 안 바뀝니다. px4io/px4-sitl-gazebo 가 양쪽 아키텍처를 다 갖고 있어서입니다.
services:
  fleet:
    environment:
      HEADLESS: 0
      DISPLAY: ${DISPLAY:-:0}
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all,graphics
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, graphics]
