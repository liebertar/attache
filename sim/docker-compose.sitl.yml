# 진짜 PX4 자동조종 한 대를 런타임 뒤에 붙입니다. 나머지는 그대로 시뮬레이션입니다.
#
#   docker compose -f docker-compose.local.yml -f sim/docker-compose.sitl.yml --env-file .env.local up --build
#
# 무엇이 기록이고 무엇이 거울인가:
#   시뮬레이터가 네 대 모두의 기록의 세계입니다 — 짐 싣기, 점수판, 판정에 쓰는 텔레메트리.
#   그중 drone-01(MAVLINK_MIRROR) 한 대는 PX4 도 같이 납니다. 런타임이 그 기체에 실행하는 명령은
#   시뮬레이터에 먼저, 그다음 PX4 로 갑니다. 승인된 경로가 그대로 PX4 임무가 되고(MISSION_ITEM_INT),
#   회수·기상 대기가 진짜 자동조종에 닿고, 거절된 신청은 시동조차 걸지 않습니다.
#   성패는 시뮬레이터의 답이 정하고 PX4 의 답은 옆에 적힐 뿐입니다 — /state.autopilots 와
#   원장 옆의 autopilot.jsonl. 직결 세계(direct-*)는 손대지 않습니다. 그쪽은 계속 시뮬레이션입니다.
#
# PX4 는 SIH(자동조종 안에서 기체 물리까지 돌림)라 Gazebo 가 없습니다: CPU 반 코어, 메모리 10 MiB.
# 공식 이미지 px4io/px4-sitl-gazebo 는 amd64·arm64 를 둘 다 갖고 있어 Mac 에서도 NVIDIA 기계에서도
# 같은 파일로 돕니다.
#
# 보는 법:
#   curl -s localhost:8000/state | python3 -c 'import json,sys; print(json.load(sys.stdin)["autopilots"])'
#   QGroundControl 을 켜면 UDP 14550 으로 이 기체가 그대로 뜹니다.
#
# 호스트에서 스택을 돌리면서 PX4 만 컨테이너로 띄우려면 scripts/sitl.sh 를 쓰세요(시연용).

services:
  px4:
    image: px4io/px4-sitl-gazebo:v1.18.0-beta2
    environment:
      PX4_SIM_MODEL: sihsim_quadx
      # 거울 기체의 창고 옥상 자리 (sim/world.py SEATS[0], 옥상 높이 SEAT_ROOF_M=9).
      # 여기서 시작해야 PX4 의 궤적이 지도 위의 그 기체와 겹칩니다.
      PX4_HOME_LAT: "40.701803"
      PX4_HOME_LON: "-73.970437"
      PX4_HOME_ALT: "9"
      # 배속은 1 입니다. SIH 의 락스텝은 이 Mac 의 Docker 에서 1배만 버팁니다(잰 값: 1배 → 0.94배,
      # 2배 → 0.96~1.74배로 들쭉날쭉, 4배 → 0.26배 — 오히려 느려지고 CPU 만 먹습니다). 기본 틱(0.2초)의
      # 시뮬은 4배속이라 PX4 가 지도의 기체보다 뒤처집니다. 나란히 날게 하려면 TICK_SECONDS=0.8.
      PX4_SIM_SPEED_FACTOR: ${PX4_SIM_SPEED_FACTOR:-1}
      # 시뮬 기체의 속도에 맞춥니다: 순항 22 m/s, 상승 2 m/s, 하강 1.75 m/s.
      PX4_PARAM_MPC_XY_CRUISE: "20"
      PX4_PARAM_MPC_XY_VEL_MAX: "20"
      PX4_PARAM_MPC_TKO_SPEED: "2"
      PX4_PARAM_MPC_Z_V_AUTO_UP: "2"
      PX4_PARAM_MPC_Z_V_AUTO_DN: "1.75"
      # 조종기가 없는 배선입니다. 임무 중에는 조종기 두절을 실패로 보지 않습니다.
      PX4_PARAM_COM_RCL_EXCEPT: "1"
      # 오프보드 MAVLink 를 받을 컨테이너. 이름을 주소로 바꾸는 일은 entrypoint 가 합니다.
      MAVLINK_PARTNER: runtime
    volumes:
      - ./sim/fleet-entrypoint.sh:/fleet-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/fleet-entrypoint.sh"]
    # Linux 에서도 지상국 링크가 호스트로 가게(Docker Desktop 에는 이미 있습니다).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [world]
    restart: unless-stopped

  runtime:
    environment:
      ADAPTER: composite
      MAVLINK_MIRROR: ${MAVLINK_MIRROR:-drone-01}
      MAVLINK_ENDPOINT: udpin:0.0.0.0:14540
      # PX4 의 답은 원장 옆 줄 파일에. 원장 줄은 자동조종이 답하기 전에 닫힙니다.
      AUTOPILOT_LOG: /data/autopilot.jsonl
    depends_on: [sim, px4]
