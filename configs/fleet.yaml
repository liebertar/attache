# 런타임은 착륙 패드가 뭔지 모릅니다. 이 파일이 분야를 정합니다.
name: manhattan-delivery

resources:
  - pad:launch

authority:
  # 돈 한도는 없습니다. 예산은 운영사(기업)의 몫이고 이 런타임은 안전(경로·고도·구역·분리)만 판정합니다.
  # 숫자를 넣으면 그 한도를 넘는 신청은 사람에게 갑니다.
  per_asset_usd: null
  fleet_usd: null
  # 이 영향 범위는 무조건 사람이 봅니다
  human_required_blast:
    - public
    - passenger
  # 이 행동은 비용과 무관하게 사람이 봅니다
  human_required_actions:
    - disengage_autonomy

# 리콜 같은 전면 금지. 한도보다 먼저 보고, 모델한테 물어보지도 않습니다.
# 시뮬레이터가 공지를 띄우면 런타임이 여기에 한 줄을 더합니다.
policies: []

# Nebius Token Factory 의 모델 id. super 는 확인된 값이고, ultra 는 대소문자를 못 확인했고,
# nano 는 목록에 없으면 Nemotron 3.5 Lightning(30B-A3B, 2026-08)이 그 자리입니다.
# 실제 목록은 `scripts/llm_probe.py` 가 GET /v1/models 로 보여줍니다. 환경 변수
# MODEL_NANO/MODEL_SUPER/MODEL_ULTRA 가 있으면 이 값을 덮어씁니다(Ollama 로컬 = nemotron-3-nano).
models:
  nano: nvidia/Nemotron-3_5-Lightning
  super: nvidia/nemotron-3-super-120b-a12b
  ultra: nvidia/Nemotron-3-Ultra-550b-a55b

# 운영사가 신고한 기체 성능과 이 판의 시계. 런타임은 이것으로 승인한 경로의 4D 의도(어느 구간에
# 언제 있을지)를 셈하고, 다른 기체의 의도와 겹치는 신청을 거절합니다. 시뮬레이터(sim/world.py)
# 상수와 같아야 하고 tests/test_intents.py 가 대조합니다. clock_epoch_z 는 틱 0 의 Zulu 시각 —
# NOTAM 본문의 "0907-0912Z" 같은 시간 창을 틱으로 옮기는 기준입니다.
performance:
  cruise_mps: 22.0
  climb_mps: 2.0
  descent_mps: 1.75
  seconds_per_tick: 0.8
  clearance_ticks: 25
  clock_epoch_z: "0900"
  # 항법 오차. 회랑 반폭 = 분리 최소치 30m + 이 값. 시뮬레이터의 경유점 반경 6m 보다 커야 합니다.
  nav_tolerance_m: 10.0
  # 통신 두절 대비. 조종장치가 링크를 잃으면 승인된 경로를 그대로 날아 목적지에 내립니다
  # (continue_and_land). 런타임은 떠 있는 기체의 텔레메트리가 timeout_ticks 동안 안 새로워지면
  # 두절로 보고, 그 기체의 의도(승인 경로 + 착륙 기둥)를 예약된 채로 둔 채 사람 카드를 올립니다.
  # 다른 행동(return_to_launch 등)은 아직 판정하지 않으므로 여기 적으면 경로 신청이 전부 거절됩니다.
  lost_link:
    behaviour: continue_and_land
    timeout_ticks: 15

# 날씨 한도. 보고서(시뮬레이터 공지·Tavily 검색·수동 입력)의 숫자가 이 밖이면 런타임이 이륙을
# 세웁니다(WEATHER HOLD: 땅에서 낸 fly_route·reserve_pad·depart 거절, 떠 있는 기체는 그대로 내림).
# 한도 안의 보고서가 뒤에 와도 저절로 풀리지 않습니다 — 창이 닫히거나 사람이 풉니다(승인 화면).
# 창이 없는 보고서는 hold_default_ticks(0.8 s/틱, 500틱 ≈ 6.7분) 만큼 세웁니다.
weather:
  max_wind_mps: 10
  max_gust_mps: 12
  min_visibility_m: 1500
  hold_default_ticks: 500

# 배차: 어느 기체가 어느 착륙장을 어떤 순서로 도는가. 운영사(여기서는 시뮬레이터)의 일이고,
# 런타임은 이 절을 읽지 않습니다 — 런타임은 받은 경로를 판정할 뿐 누가 어느 주문을 받을지 정하지
# 않습니다. 코드는 sim/dispatch.py 이고, 어느 쪽이 짜든 기체는 그 정차까지 갈 경로를 따로 신청합니다.
# solver: rules  — 오늘의 규칙 배차(씨앗 7 의 판이 그대로).
# solver: cuopt  — NVIDIA cuOpt 서버(GPU, Nebius AI Cloud)에 기단의 다음 한 바퀴를 묻습니다.
#                  서버가 없거나 늦거나 답이 이상하면 그 정차는 규칙이 정하고 backoff_s 만큼 쉽니다.
# 환경 변수 DISPATCH / CUOPT_URL / CUOPT_TIMEOUT_S / CUOPT_TIME_LIMIT_S / CUOPT_BACKOFF_S 가 이깁니다.
dispatch:
  solver: rules
  cuopt_url: ""
  timeout_s: 2.0        # 세계 스레드가 기다리는 최대(초). 이만큼 틱이 멈춥니다
  time_limit_s: 1.0     # 서버가 푸는 시간(초)
  backoff_s: 60         # 한 번 실패하면 이만큼은 규칙으로

# 정보 수집. TAVILY_API_KEY 가 있을 때만 INTAKE_PERIOD_S 마다 아래 질문을 검색합니다. 결과는
# 문법(METAR 어투·주소 있는 사고)이 먼저 읽고, 못 읽는 것만 Super 가 구조화해 사람 확인을 기다립니다.
# metar_stations 는 키 없이 aviationweather.gov 에서 METAR_PERIOD_S(기본 300 초)마다 받는 관측소입니다.
# 관제탑 자기 피드와 같은 신뢰(문법이 읽으면 그 틱에 걸림) — 공식 관측이지 웹 페이지가 아닙니다.
# 환경 변수 METAR_STATIONS 가 있으면 이 목록을 덮습니다. 네트워크가 없으면 이 출처는 꺼집니다.
intake:
  queries:
    - "New York City wind gust forecast today"
    - "NYC temporary flight restriction drones today"
    - "Manhattan building fire today"
  metar_stations: [KNYC, KLGA]

# 사전 브리핑(holdshort/runtime/briefing.py). 판이 시작할 때, 그리고 방금 승인한 회랑이 이 판에 아직
# 안 물어본 동네(약 cell_km 칸)에 들어설 때 관제탑이 그 자리·그 시간을 Tavily 로 묻습니다: 행사·군중
# (9월에는 유엔 총회 주간의 VIP 비행 제한), 타워크레인(건물 자료에 없음), 착륙장인 공원·부두의 폐쇄,
# 임시 비행 제한, 기상 주의보. 문법이 읽고(못 읽는 산문만 Super 가 양식을 채움) 코드가 검사합니다.
# trusted_domains 에서 온 쪽을 문법이 읽었으면 그 틱에 걸리고(조이는 규칙이라), 그 밖의 도메인이나
# 모델이 읽은 것은 승인 화면에서 사람을 기다립니다. 기상 주의보는 정보로만 실립니다(이륙 정지는 METAR).
# 키가 없으면 tests/fixtures/tavily 의 녹음으로 돌고 화면·원장·기록에 recorded 로 표가 납니다.
# 한 판의 크레딧 한도는 환경 변수 TAVILY_BUDGET_PER_ROUND(기본 20)이고, 위 intake 검색과 나눠 씁니다.
# 질문의 {park} {street} {borough} {date} {year} 는 착륙장·지명 사전·브리핑하는 날에서 채웁니다.
briefing:
  trusted_domains: [faa.gov, weather.gov, noaa.gov, nyc.gov, nycgovparks.org, cityofnewyork.us]
  cell_km: 1.0
  max_cells_per_run: 4
  corridor_debounce_ticks: 12
  corridor_min_gap_ticks: 25
  closure_radius_m: 60       # 착륙장 둘레 이만큼 + 착륙 이격 50 m 안에 내리는 경로는 거절
  crane_radius_m: 30         # 크레인 발자국. 옆 이격 40 m 와 위 이격 crane_clearance_m 가 더해집니다
  crane_clearance_m: 50      # 건물과 같은 수직 이격
  max_window_ticks: 6000     # 창을 이만큼(0.8 s/틱, 80분)에서 자릅니다 — 판마다 다시 겁니다
  max_queries_per_run: 8
  research: true             # 판 시작마다 Tavily research 한 번(mini, 요청당 4~110 크레딧)
  research_model: mini
  queries:
    round:
      - "FAA temporary flight restriction New York City drone {date}"
      - "National Weather Service New York City wind advisory {date}"
    seasonal:
      9: ["United Nations General Assembly {year} flight restrictions East Side Manhattan"]
    park: ["{park} closure {date}"]
    street: ["tower crane permit near {street} {borough}"]
  # 판 시작마다 걷는 공식 사이트. crawl = map(10쪽당 1) + extract(5쪽당 1) 크레딧입니다.
  crawl:
    - url: "https://tfr.faa.gov/"
      instructions: "active temporary flight restrictions for New York, NY"
      limit: 6
