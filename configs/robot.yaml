# 같은 런타임, 다른 분야. 코드는 한 줄도 안 바뀝니다.
name: factory-line

resources:
  - press:line-3
  - budget:maintenance

authority:
  per_asset_usd: 500
  fleet_usd: 2000
  human_required_blast:
    - public
  human_required_actions:
    - stop_line

policies: []

# Nebius Token Factory 의 모델 id. super 는 확인된 값이고, ultra 는 대소문자를 못 확인했고,
# nano 는 목록에 없으면 Nemotron 3.5 Lightning(30B-A3B, 2026-08)이 그 자리입니다.
# 실제 목록은 `scripts/llm_probe.py` 가 GET /v1/models 로 보여줍니다. 환경 변수
# MODEL_NANO/MODEL_SUPER/MODEL_ULTRA 가 있으면 이 값을 덮어씁니다(Ollama 로컬 = nemotron-3-nano).
models:
  nano: nvidia/Nemotron-3_5-Lightning
  super: nvidia/nemotron-3-super-120b-a12b
  ultra: nvidia/Nemotron-3-Ultra-550b-a55b
