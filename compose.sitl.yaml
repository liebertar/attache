# 진짜 자동조종 여섯 대를 같은 하늘에 띄웁니다.
#
#   docker compose -f compose.yaml -f compose.sitl.yaml up --build
#
# 쓰는 이미지는 PX4 공식 px4io/px4-sitl-gazebo 한 개입니다.
# amd64 와 arm64 를 둘 다 갖고 있어서 **Mac 에서도 NVIDIA 머신에서도 같은 파일로 돕니다.**
#   Mac(arm64)      : CPU 렌더링. 느리지만 돕니다
#   NVIDIA / Nebius : GPU 렌더링. Gazebo 창이 제 속도로 돕니다
#
# 세 대는 런타임을 거쳐 날고, 세 대는 에이전트가 직접 날립니다.
#   런타임 쪽: instance 1,2,3 → MAVLink udp 14540, 14541, 14542
#   직접  쪽: instance 4,5,6 → MAVLink udp 14543, 14544, 14545
#
# 보는 방법:
#   QGroundControl 을 켜면 UDP 14550 을 스스로 잡아 여섯 대가 한 지도에 뜹니다.
#   GPU 가 있는 기계라면 HEADLESS=0 으로 Gazebo 3D 창을 그대로 띄우면 됩니다.
#
# 아직 Docker 로 실행 검증을 못 한 프로파일입니다. 먼저 링크부터 확인하세요:
#   python3 scripts/px4_check.py udpin:0.0.0.0:14540

x-direct-sitl: &direct-sitl
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: agent-direct
  networks: [world]
  depends_on: [fleet]
  restart: unless-stopped

services:
  fleet:
    # 공식 PX4 + Gazebo Harmonic. 멀티아치(amd64 + arm64), 2026-08-09 기준 v1.18.0-beta2.
    image: px4io/px4-sitl-gazebo:v1.18.0-beta2
    environment:
      HEADLESS: ${HEADLESS:-1}       # GPU 있는 기계에서는 0 으로 두면 Gazebo 창이 뜹니다
      PX4_SIM_MODEL: gz_x500
      PX4_SYS_AUTOSTART: 4001
      FLEET_SIZE: 6
    volumes:
      - ./docker/fleet-entrypoint.sh:/fleet-entrypoint.sh:ro
    entrypoint: ["/bin/bash", "/fleet-entrypoint.sh"]
    ports:
      - "14540-14545:14540-14545/udp"   # 기체별 오프보드 링크
      - "14550:14550/udp"               # QGroundControl
    networks: [world]

  # --- 런타임을 거치는 세 대 -------------------------------------------------
  runtime:
    environment:
      ADAPTER: mavlink
      MAVLINK_ENDPOINTS: >-
        drone-01=udpin:0.0.0.0:14540,drone-02=udpin:0.0.0.0:14541
    depends_on: [fleet, sim]

  # --- 직접 날리는 세 대 -----------------------------------------------------
  # 같은 기종, 같은 감지 코드, 같은 신청서 작성기, 같은 모델.
  # 다른 건 이 세 줄의 MAVLINK_ENDPOINT 뿐입니다.
  direct-drone-01:
    <<: *direct-sitl
    environment:
      ASSET_ID: drone-01
      TRANSPORT: mavlink
      MAVLINK_ENDPOINT: udpin:0.0.0.0:14543
      SIM_URL: http://sim:8100
      VEHICLE_MODEL: dv-x500

  direct-drone-02:
    <<: *direct-sitl
    environment:
      ASSET_ID: drone-02
      TRANSPORT: mavlink
      MAVLINK_ENDPOINT: udpin:0.0.0.0:14544
      SIM_URL: http://sim:8100
      VEHICLE_MODEL: dv-hexa


  # sim 은 그대로 둡니다. 기체는 PX4 가 날리지만 리콜 공지는 여전히 여기서 옵니다.
