# 진짜 자동조종으로 여섯 대를 동시에 날립니다.
#
#   docker compose -f compose.yaml -f compose.sitl.yaml up --build
#
# SITL(Software In The Loop)은 실제 비행 소프트웨어를 그대로 PC 에서 돌리는 겁니다.
# 자세와 추력은 자동조종이 잡습니다. 우리도, 모델도 거기엔 손을 못 댑니다.
#
# 세 대는 런타임을 거쳐 날고, 세 대는 에이전트가 직접 날립니다. 같은 하늘에서 동시에.
# QGroundControl 을 켜면 여섯 대가 한 지도 위에 뜹니다 (UDP 14550 을 스스로 잡습니다).
#   http://qgroundcontrol.com
#
# 아직 Docker 로 검증하지 못한 프로파일입니다. 먼저 링크부터 확인하세요:
#   python3 scripts/px4_check.py tcp:localhost:5760

x-direct-sitl: &direct-sitl
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: agent-direct
  networks: [world]
  depends_on: [sitl]
  restart: unless-stopped

services:
  sitl:
    # ArduPilot 코퍼 6대. TCP 5760, 5770, 5780 / 5790, 5800, 5810.
    # PX4 로 바꾸려면 jonasvautherin/px4-gazebo-headless 를 쓰고 엔드포인트를
    # udpin:0.0.0.0:1454x 로 두면 됩니다. 어댑터도 에이전트도 코드는 그대로입니다.
    image: radarku/sitl-swarm
    platform: linux/amd64          # Apple Silicon 은 로제타로 돌립니다
    environment:
      NUMCOPTERS: 6
    ports:
      - "5760-5810:5760-5810"
      - "14550:14550/udp"          # QGroundControl 이 여기를 봅니다
    networks: [world]

  # --- 런타임을 거치는 세 대 -------------------------------------------------
  runtime:
    environment:
      ADAPTER: mavlink
      MAVLINK_ENDPOINTS: >-
        taxi-a=tcp:sitl:5760,drone-b=tcp:sitl:5770,taxi-c=tcp:sitl:5780
    depends_on: [sitl, sim]

  # --- 직접 날리는 세 대 -----------------------------------------------------
  # 같은 기종, 같은 감지 코드, 같은 신청서 작성기, 같은 모델.
  # 다른 건 이 세 줄의 MAVLINK_ENDPOINT 뿐입니다.
  direct-taxi-a:
    <<: *direct-sitl
    environment:
      ASSET_ID: taxi-a
      TRANSPORT: mavlink
      MAVLINK_ENDPOINT: tcp:sitl:5790
      SIM_URL: http://sim:8100
      VEHICLE_MODEL: robotaxi-v3

  direct-drone-b:
    <<: *direct-sitl
    environment:
      ASSET_ID: drone-b
      TRANSPORT: mavlink
      MAVLINK_ENDPOINT: tcp:sitl:5800
      SIM_URL: http://sim:8100
      VEHICLE_MODEL: hexa-2

  direct-taxi-c:
    <<: *direct-sitl
    environment:
      ASSET_ID: taxi-c
      TRANSPORT: mavlink
      MAVLINK_ENDPOINT: tcp:sitl:5810
      SIM_URL: http://sim:8100
      VEHICLE_MODEL: robotaxi-v3

  # sim 은 그대로 둡니다. 기체는 SITL 이 날리지만 리콜 공지는 여전히 여기서 옵니다.
