# 진짜 자동조종에 붙입니다. 우리 시뮬레이터 대신 SITL 이 실제로 비행합니다.
#
#   docker compose -f compose.yaml -f compose.sitl.yaml up --build
#
# SITL(Software In The Loop)은 실제 비행 소프트웨어를 그대로 PC 에서 돌리는 겁니다.
# 자세와 추력은 자동조종이 잡고, 우리는 임무 단위 명령만 보냅니다.
# 모델은 조종면 근처에도 못 갑니다. ASTM F3269 가 말하는 나눔이 이 파일에 그대로 있습니다.
#
# 화면으로 보려면 QGroundControl 을 켜세요. UDP 14550 을 스스로 잡아서 기체 셋이
# 지도 위에 뜹니다. 실제 드론 운용자가 쓰는 그 프로그램입니다.
#   http://qgroundcontrol.com  (Mac 은 .dmg)
#
# 아직 이 프로파일은 Docker 로 검증하지 못했습니다. 이미지 인자와 포트는
# scripts/px4_check.py 로 먼저 확인하세요.

services:
  sitl:
    # ArduPilot SITL 코퍼 3대. TCP 5760 / 5770 / 5780.
    # PX4 로 바꾸려면 jonasvautherin/px4-gazebo-headless 를 쓰고 엔드포인트를
    # udpin:0.0.0.0:14540.. 로 두면 됩니다. 어댑터 코드는 그대로입니다.
    image: radarku/sitl-swarm
    platform: linux/amd64          # Apple Silicon 은 로제타로 돌립니다
    environment:
      NUMCOPTERS: 3
    ports:
      - "5760:5760"
      - "5770:5770"
      - "5780:5780"
      - "14550:14550/udp"          # QGroundControl 이 여기를 봅니다
    networks: [world]

  runtime:
    environment:
      ADAPTER: mavlink
      MAVLINK_ENDPOINTS: >-
        taxi-a=tcp:sitl:5760,drone-b=tcp:sitl:5770,taxi-c=tcp:sitl:5780
    depends_on: [sitl]

  # 조종장치를 직접 만지는 쪽은 이 프로파일에서 내립니다.
  # 그 배선을 진짜 자동조종에 붙이는 건 시연으로도 하면 안 되는 일이라서입니다.
  direct-taxi-a: { profiles: ["never"] }
  direct-drone-b: { profiles: ["never"] }
  direct-taxi-c: { profiles: ["never"] }
  # sim 은 그대로 둡니다. 기체는 SITL 이 날리지만 리콜 공지는 여전히 여기서 옵니다.
