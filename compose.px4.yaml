# 진짜 자동조종에 붙입니다. 우리 시뮬레이터 대신 PX4 SITL 이 실제로 비행합니다.
#
#   docker compose -f compose.yaml -f compose.px4.yaml up --build
#
# PX4 는 배송 드론이 실제로 쓰는 비행 소프트웨어입니다. 자세와 추력은 PX4 가 잡고,
# 우리는 임무 단위 명령만 보냅니다. 모델은 그 근처에도 못 갑니다.
# 이게 ASTM F3269 가 말하는 나눔이고, 이 파일이 그 나눔을 눈에 보이게 합니다.
#
# Apple Silicon 에서는 platform 지정이 필요합니다(로제타 에뮬레이션).
# ArduPilot 로 바꾸려면 이미지를 radarku/sitl-swarm(NUMCOPTERS=3, tcp 5760/5770/5780)로
# 두고 MAVLINK_ENDPOINTS 를 tcp:... 로 바꾸면 됩니다. 어댑터 코드는 그대로입니다.

x-px4: &px4
  image: jonasvautherin/px4-gazebo-headless:latest
  platform: linux/amd64
  networks: [world]
  restart: unless-stopped

services:
  px4-taxi-a:
    <<: *px4
    command: ["runtime"]
    environment: { PX4_SIM_MODEL: iris }

  px4-drone-b:
    <<: *px4
    command: ["runtime"]
    environment: { PX4_SIM_MODEL: iris }

  px4-taxi-c:
    <<: *px4
    command: ["runtime"]
    environment: { PX4_SIM_MODEL: iris }

  runtime:
    environment:
      ADAPTER: mavlink
      MAVLINK_ENDPOINTS: >-
        taxi-a=udpin:0.0.0.0:14540,drone-b=udpin:0.0.0.0:14541,taxi-c=udpin:0.0.0.0:14542
    ports:
      - "14540-14542:14540-14542/udp"

  # 조종장치를 직접 만지는 쪽은 이 프로파일에서 내립니다.
  # 진짜 기체에 그 배선을 붙이는 건 시연으로도 하면 안 되는 일입니다.
  direct-taxi-a:
    profiles: ["never"]
  direct-drone-b:
    profiles: ["never"]
  direct-taxi-c:
    profiles: ["never"]
