# 기체 위에서 (Jetson). docker compose -f docker-compose.local.yml -f drone/docker-compose.edge.yml --env-file .env.local up
# 8GB Orin Nano 에는 30B 가 안 들어갑니다. 9B 를 씁니다.
services:
  llm-edge:
    build:
      context: .
      dockerfile: drone/Dockerfile.llm-edge
    runtime: nvidia
    environment:
      MODEL_PATH: /models/nemotron-nano-9b-v2-q4_k_m.gguf
      NGL: 99
    volumes: [models:/models]
    networks: [fleet]

  guarded-drone-01:
    environment:
      LLM_BASE_URL: http://llm-edge:8080/v1
      MODEL_NANO: nemotron-nano-9b-v2
      MODEL_SUPER: nemotron-nano-9b-v2

volumes:
  models: {}
